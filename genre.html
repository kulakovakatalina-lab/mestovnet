<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Местов.Нет — Жанр</title>
<link rel="icon" type="image/png" href="/images/fav.png">
<style>
:root {
  --bg:      oklch(99% 0.002 240);
  --surface: oklch(100% 0 0);
  --fg:      oklch(18% 0.012 250);
  --muted:   oklch(54% 0.012 250);
  --border:  oklch(92% 0.005 250);
  --accent:  oklch(58% 0.18 255);

  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, Menlo, monospace;

  --radius-sm: 6px;
  --radius:    10px;
  --nav-h:     56px;
  --gutter:    clamp(16px, 4vw, 48px);
  --max-w:     1440px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; background: none; border: none; cursor: pointer; }

.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  height: var(--nav-h);
  background: oklch(99% 0.002 240 / 0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 var(--gutter);
  gap: 8px;
}
.nav-logo {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.035em;
  flex-shrink: 0;
  color: var(--fg);
}
.nav-logo em { color: var(--accent); font-style: normal; }
.nav-sep { width: 1px; height: 20px; background: var(--border); margin: 0 8px; flex-shrink: 0; }
.nav-genres {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  flex: 1;
}
.nav-genres::-webkit-scrollbar { display: none; }
.nav-genre {
  padding: 5px 13px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  border-radius: 100px;
  white-space: nowrap;
  transition: color 0.12s, background 0.12s;
}
.nav-genre:hover { color: var(--fg); background: var(--border); }
.nav-genre.active {
  color: var(--accent);
  background: oklch(58% 0.18 255 / 0.08);
}

.genre-strip-mobile {
  display: none;
  overflow-x: auto;
  scrollbar-width: none;
  gap: 6px;
  padding: 10px var(--gutter);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.genre-strip-mobile::-webkit-scrollbar { display: none; }
.genre-strip-mobile a {
  flex-shrink: 0;
  padding: 5px 14px;
  border: 1px solid var(--border);
  border-radius: 100px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
  transition: all 0.12s;
}
.genre-strip-mobile a:hover,
.genre-strip-mobile a.active { border-color: var(--accent); color: var(--accent); }

.genre-hero {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: clamp(36px, 6vw, 64px) var(--gutter) clamp(28px, 4vw, 44px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}

.genre-hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
}
.genre-hero-title {
  font-family: var(--font-display);
  font-size: clamp(36px, 5.5vw, 68px);
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1.0;
  color: var(--fg);
}

.genre-hero-meta {
  text-align: right;
  flex-shrink: 0;
}
.genre-hero-count {
  font-family: var(--font-mono);
  font-size: 48px;
  font-weight: 700;
  color: var(--fg);
  letter-spacing: -0.05em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.genre-hero-count-label {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}

.filters-bar {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 20px var(--gutter);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}
.filters-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--muted);
  flex-shrink: 0;
  margin-right: 4px;
}
.city-pills {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}
.city-pills::-webkit-scrollbar { display: none; }
.city-pill {
  flex-shrink: 0;
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 100px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  transition: all 0.12s;
}
.city-pill:hover { border-color: oklch(78% 0.01 250); color: var(--fg); }
.city-pill.active { background: var(--fg); border-color: var(--fg); color: var(--bg); }

.events-list {
  max-width: var(--max-w);
  margin: 0 auto;
}

.event-row {
  display: grid;
  grid-template-columns: 80px 80px 1fr auto;
  gap: 24px;
  align-items: start;
  padding: clamp(18px, 3vw, 28px) var(--gutter);
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}
.event-row:hover { background: var(--surface); }

.row-thumb {
  width: 72px;
  height: 72px;
  border-radius: 8px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.row-thumb svg { opacity: 0.22; }
.row-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center top; border-radius: 8px; }

.row-date {
  flex-shrink: 0;
  text-align: center;
}
.row-date-day {
  font-family: var(--font-mono);
  font-size: 32px;
  font-weight: 700;
  color: var(--fg);
  letter-spacing: -0.05em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.row-date-month {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 3px;
}
.row-date-dow {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.row-artist {
  font-family: var(--font-display);
  font-size: clamp(18px, 2.5vw, 24px);
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.15;
  color: var(--fg);
  margin-bottom: 6px;
}
.row-desc {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.55;
  max-width: 560px;
  margin-bottom: 10px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.row-venue {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
}
.row-venue-dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--border);
  flex-shrink: 0;
}

.row-right {
  text-align: right;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}
.row-time {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.row-price {
  font-size: 14px;
  font-weight: 600;
  color: var(--fg);
}
.row-btn {
  display: inline-flex;
  align-items: center;
  padding: 8px 16px;
  background: oklch(58% 0.18 255 / 0.10);
  color: var(--accent);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  transition: opacity 0.12s;
  white-space: nowrap;
  text-decoration: none;
}
.row-btn:hover { opacity: 0.80; }

.pill {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.pill-jazz    { background: oklch(58% 0.18 255 / 0.10); color: var(--accent); }
.pill-rock    { background: oklch(55% 0.15 15  / 0.10); color: oklch(50% 0.15 15); }
.pill-folk    { background: oklch(50% 0.12 150 / 0.10); color: oklch(46% 0.12 150); }
.pill-blues   { background: oklch(52% 0.14 270 / 0.10); color: oklch(50% 0.16 270); }
.pill-classic { background: oklch(52% 0.10 60  / 0.10); color: oklch(46% 0.10 60); }
.pill-pop     { background: oklch(58% 0.16 320 / 0.10); color: oklch(54% 0.16 320); }

.bg-jazz    { background: linear-gradient(135deg, oklch(22% 0.04 255), oklch(32% 0.08 255)); }
.bg-folk    { background: linear-gradient(135deg, oklch(24% 0.04 155), oklch(34% 0.08 145)); }
.bg-rock    { background: linear-gradient(135deg, oklch(22% 0.04 15),  oklch(32% 0.06 20)); }
.bg-blues   { background: linear-gradient(135deg, oklch(22% 0.06 270), oklch(30% 0.10 265)); }
.bg-classic { background: linear-gradient(135deg, oklch(28% 0.06 65),  oklch(36% 0.09 58)); }
.bg-pop     { background: linear-gradient(135deg, oklch(30% 0.10 325), oklch(40% 0.14 310)); }

.other-genres {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: clamp(28px, 4vw, 44px) var(--gutter);
  border-top: 1px solid var(--border);
}
.other-genres-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
}
.other-genres-list {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.other-genre-link {
  padding: 7px 16px;
  border: 1px solid var(--border);
  border-radius: 100px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  transition: all 0.12s;
}
.other-genre-link:hover { border-color: var(--fg); color: var(--fg); }

footer {
  border-top: 1px solid var(--border);
  padding: 32px var(--gutter);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  max-width: var(--max-w);
  margin: 0 auto;
}
.footer-logo {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--fg);
}
.footer-logo em { color: var(--accent); font-style: normal; }
.footer-note { font-size: 13px; color: var(--muted); }

.loading { text-align: center; padding: 80px 0; color: var(--muted); font-size: 15px; }

@media (max-width: 820px) {
  .event-row {
    grid-template-columns: 64px 64px 1fr;
    grid-template-rows: auto auto;
  }
  .row-thumb { width: 56px; height: 56px; }
  .row-right {
    grid-column: 2 / -1;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    margin-top: 8px;
  }
  .genre-hero-meta { text-align: left; }
}

@media (max-width: 600px) {
  :root { --nav-h: 52px; }
  .nav-genres, .nav-sep { display: none; }
  .genre-strip-mobile { display: flex; }
  .genre-hero { flex-direction: column; align-items: flex-start; }
  .genre-hero-meta { text-align: left; }
  .event-row {
    grid-template-columns: 48px 1fr;
    grid-template-rows: auto auto;
  }
  .row-thumb { display: none; }
  .row-date-day { font-size: 26px; }
  .row-right {
    grid-column: 2;
    flex-wrap: wrap;
    gap: 8px;
  }
  footer { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">местов<em>.нет</em></a>
  <div class="nav-sep"></div>
  <div class="nav-genres" id="nav-genres"></div>
</nav>

<div class="genre-strip-mobile" id="mobile-strip"></div>

<div class="genre-hero">
  <div>
    <div class="genre-hero-eyebrow" id="hero-eyebrow">Подборка · Крым</div>
    <h1 class="genre-hero-title" id="hero-title">Загрузка...</h1>
  </div>
  <div class="genre-hero-meta">
    <div class="genre-hero-count" id="hero-count">—</div>
    <div class="genre-hero-count-label" id="hero-label">концертов</div>
  </div>
</div>

<div class="filters-bar">
  <span class="filters-label">Город</span>
  <div class="city-pills" id="city-filter">
    <button class="city-pill active" data-city="all">Все</button>
  </div>
</div>

<div class="events-list" id="events-list">
  <div class="loading">Загрузка событий...</div>
</div>

<footer>
  <a href="index.html" class="footer-logo">местов<em>.нет</em></a>
  <span class="footer-note">Афиша живой музыки Крыма · 2026</span>
</footer>

<script>
const GENRE_MAP = {
  'джаз': 'jazz', 'рок': 'rock', 'русский рок': 'rock', 'панк-рок': 'rock',
  'инди-рок': 'rock', 'метал': 'rock', 'инди': 'rock', 'авторская': 'rock',
  'классика': 'classic', 'хоровая': 'classic', 'медитативная': 'classic',
  'поп': 'pop', 'поп-рок': 'pop', 'лаунж': 'pop', 'хип-хоп': 'pop',
  'каверы': 'pop', 'юмор': 'pop', 'шоу': 'pop', 'интерактив': 'pop',
  'этно': 'folk', 'фолк-метал': 'folk', 'народная': 'folk',
  'блюз': 'blues'
};

const GENRE_LABELS = {
  jazz: 'Джаз', rock: 'Рок', folk: 'Фолк', blues: 'Блюз', classic: 'Классика', pop: 'Поп'
};

const CITY_MAP = {
  'Севастополь': 'sevastopol', 'Симферополь': 'simferopol', 'Ялта': 'yalta',
  'Судак': 'sudak', 'Керчь': 'kerch', 'Коктебель': 'koktebel',
  'Бахчисарай': 'bakhchisaray', 'Евпатория': 'evpatoria', 'Крым': 'all'
};

const CITY_LABELS = {
  sevastopol: 'Севастополь', simferopol: 'Симферополь', yalta: 'Ялта',
  sudak: 'Судак', kerch: 'Керчь', koktebel: 'Коктебель',
  bakhchisaray: 'Бахчисарай', evpatoria: 'Евпатория'
};

const MONTHS_GEN = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const DOW = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];

const genreIcon = (g) => `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;

function mapGenre(raw) { return GENRE_MAP[raw?.toLowerCase()] || 'pop'; }
function mapCity(raw) { return CITY_MAP[raw] || 'all'; }

function parseDate(d) {
  const parts = d.split('-');
  return new Date(+parts[0], +parts[1] - 1, +parts[2]);
}

function formatDate(d) {
  return { day: String(d.getDate()).padStart(2, '0'), month: MONTHS_GEN[d.getMonth()], dow: DOW[d.getDay()] };
}

function priceText(p) {
  if (!p) return 'Бесплатно';
  const low = p.toLowerCase();
  if (low.includes('бесплат') || low === 'вход свободный') return 'Бесплатно';
  return p;
}

let allEvents = [];
let currentGenre = 'jazz';
let currentCity = 'all';

function applySettings(data, settings) {
  const hiddenSet = new Set(settings.hidden || []);
  const ovNames   = settings.names        || {};
  const ovTimes   = settings.times        || {};
  const ovPrices  = settings.prices       || {};
  const ovImages  = settings.images       || {};
  const ovCities  = settings.cities       || {};
  const ovVenues  = settings.venues       || {};
  const ovDescs   = settings.descriptions || {};
  const ovGenres  = settings.genres       || {};
  return data.map((e, i) => {
    const url = e.source_url || '';
    if (hiddenSet.has(url)) return null;
    const ev = { ...e, _origIdx: i };
    if (url in ovNames)  ev.artist      = ovNames[url];
    if (url in ovTimes)  ev.time        = ovTimes[url];
    if (url in ovPrices) ev.price       = ovPrices[url];
    if (url in ovImages) ev.image       = ovImages[url] === null ? null : ovImages[url];
    if (url in ovCities) ev.source_city = ovCities[url];
    if (url in ovVenues) ev.venue       = ovVenues[url];
    if (url in ovDescs)  ev.description = ovDescs[url];
    if (url in ovGenres) ev.genre       = ovGenres[url];
    return ev;
  }).filter(Boolean);
}

async function load() {
  currentGenre = new URLSearchParams(location.search).get('g') || 'jazz';

  try {
    const [res, settingsRes] = await Promise.all([
      fetch('events.json'),
      fetch('settings.json').catch(() => null)
    ]);
    const data = await res.json();
    const settings = (settingsRes && settingsRes.ok) ? await settingsRes.json().catch(() => ({})) : {};
    const patched = applySettings(data, settings);
    const today = new Date(); today.setHours(0, 0, 0, 0);

    allEvents = patched
      .filter(e => e.date && parseDate(e.date) >= today)
      .map(e => ({
        ...e,
        dateObj: parseDate(e.date),
        genre: mapGenre(e.genre),
        city: mapCity(e.source_city),
        dateFmt: formatDate(parseDate(e.date)),
        priceDisplay: priceText(e.price),
        globalIdx: e._origIdx
      }))
      .sort((a, b) => a.dateObj - b.dateObj || (a.time || '').localeCompare(b.time || ''));

    renderAll();
  } catch (err) {
    document.getElementById('events-list').innerHTML = '<div class="loading">Не удалось загрузить события</div>';
  }
}

function renderNavGenres() {
  const counts = {};
  allEvents.forEach(e => { counts[e.genre] = (counts[e.genre] || 0) + 1; });
  const order = ['jazz', 'rock', 'folk', 'blues', 'classic', 'pop'];
  const active = order.filter(g => counts[g]);

  const navHtml = active.map(g =>
    `<a href="genre.html?g=${g}" class="nav-genre${g === currentGenre ? ' active' : ''}" data-g="${g}">${GENRE_LABELS[g]}</a>`
  ).join('');
  document.getElementById('nav-genres').innerHTML = navHtml;

  const mobileHtml = active.map(g =>
    `<a href="genre.html?g=${g}" data-g="${g}" class="${g === currentGenre ? 'active' : ''}">${GENRE_LABELS[g]}</a>`
  ).join('');
  document.getElementById('mobile-strip').innerHTML = mobileHtml;
}

function renderAll() {
  const genreEvents = allEvents.filter(e => e.genre === currentGenre);
  const filtered = currentCity === 'all' ? genreEvents : genreEvents.filter(e => e.city === currentCity);

  const label = GENRE_LABELS[currentGenre] || currentGenre;
  document.title = `Местов.Нет — ${label}`;
  document.getElementById('hero-title').textContent = `${label} в Крыму`;
  document.getElementById('hero-count').textContent = genreEvents.length;

  const countLabel = genreEvents.length === 1 ? 'концерт' : genreEvents.length < 5 ? 'концерта' : 'концертов';
  document.getElementById('hero-label').textContent = countLabel;

  renderNavGenres();
  renderCityPills(genreEvents);
  renderEvents(filtered);
}

function renderCityPills(events) {
  const cities = new Set(events.map(e => e.city).filter(c => c !== 'all'));
  const container = document.getElementById('city-filter');
  let html = '<button class="city-pill active" data-city="all">Все</button>';
  const sorted = [...cities].sort((a, b) => (CITY_LABELS[a] || a).localeCompare(CITY_LABELS[b] || b, 'ru'));
  for (const c of sorted) {
    html += `<button class="city-pill" data-city="${c}">${CITY_LABELS[c] || c}</button>`;
  }
  container.innerHTML = html;
}

function renderEvents(events) {
  const list = document.getElementById('events-list');
  if (!events.length) { list.innerHTML = '<div class="loading">Нет событий в этом жанре</div>'; return; }

  list.innerHTML = events.map(ev => {
    const thumbHtml = ev.image
      ? `<img src="${ev.image}" alt="${ev.artist || ''}" loading="lazy">`
      : `<div class="bg-${ev.genre}" style="width:100%;height:100%;border-radius:inherit;display:flex;align-items:center;justify-content:center;">${genreIcon(ev.genre)}</div>`;

    const isFree = ev.priceDisplay === 'Бесплатно' || ev.priceDisplay === 'Вход свободный';

    return `<a href="event.html?id=${ev.id}" class="event-row" data-genre="${ev.genre}" data-city="${ev.city}">
      <div class="row-date">
        <div class="row-date-day">${ev.dateFmt.day}</div>
        <div class="row-date-month">${ev.dateFmt.month}</div>
        <div class="row-date-dow">${ev.dateFmt.dow}</div>
      </div>
      <div class="row-thumb">${thumbHtml}</div>
      <div>
        <div class="row-artist">${ev.artist || '—'}</div>
        <div class="row-desc">${ev.description || ''}</div>
        <div class="row-venue">
          <span>${ev.venue || '—'}</span>
          <span class="row-venue-dot"></span>
          <span>${ev.source_city || '—'}</span>
        </div>
      </div>
      <div class="row-right">
        ${ev.time ? `<span class="row-time">${ev.time}</span>` : ''}
        <span class="row-price">${ev.priceDisplay}</span>
        <span class="row-btn">Подробнее</span>
      </div>
    </a>`;
  }).join('');
}


document.getElementById('city-filter').addEventListener('click', function(e) {
  const btn = e.target.closest('.city-pill');
  if (!btn) return;
  document.querySelectorAll('.city-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  currentCity = btn.dataset.city;
  const genreEvents = allEvents.filter(e => e.genre === currentGenre);
  const filtered = currentCity === 'all' ? genreEvents : genreEvents.filter(e => e.city === currentCity);
  renderEvents(filtered);
});

load();
</script>
</body>
</html>
