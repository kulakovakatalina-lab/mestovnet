<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Местов.Нет — Мероприятие</title>
<link rel="icon" type="image/png" href="/images/fav.png">
<style>
:root {
  --bg:      oklch(99% 0.002 240);
  --surface: oklch(100% 0 0);
  --fg:      oklch(18% 0.012 250);
  --muted:   oklch(54% 0.012 250);
  --border:  oklch(92% 0.005 250);
  --accent:  oklch(58% 0.18 255);

  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, Menlo, monospace;

  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 16px;
  --nav-h:     56px;
  --gutter:    clamp(16px, 4vw, 48px);
  --max-w:     1200px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  height: var(--nav-h);
  background: oklch(99% 0.002 240 / 0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 var(--gutter);
  gap: 8px;
}
.nav-logo {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.035em;
  flex-shrink: 0;
  color: var(--fg);
}
.nav-logo em { color: var(--accent); font-style: normal; }
.nav-sep { width: 1px; height: 20px; background: var(--border); margin: 0 8px; flex-shrink: 0; }
.nav-genres {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  flex: 1;
}
.nav-genres::-webkit-scrollbar { display: none; }
.nav-genre {
  padding: 5px 13px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  border-radius: 100px;
  white-space: nowrap;
  transition: color 0.12s, background 0.12s;
}
.nav-genre:hover { color: var(--fg); background: var(--border); }
.nav-genre.active {
  color: var(--accent);
  background: oklch(58% 0.18 255 / 0.08);
}

.genre-strip-mobile {
  display: none;
  overflow-x: auto;
  scrollbar-width: none;
  gap: 6px;
  padding: 10px var(--gutter);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.genre-strip-mobile::-webkit-scrollbar { display: none; }
.genre-strip-mobile a {
  flex-shrink: 0;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 100px;
  white-space: nowrap;
}
.genre-strip-mobile a.active {
  color: var(--accent);
  border-color: var(--accent);
}

.event-hero {
  width: 100%;
  position: relative;
}
.event-hero-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 16px var(--gutter) 32px;
}
.event-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  transition: color 0.12s;
  margin-bottom: 24px;
}
.event-back:hover { color: var(--fg); }
.event-back svg { width: 14px; height: 14px; flex-shrink: 0; }
.event-hero-grid {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 40px;
  align-items: start;
}
.event-poster-col {
  position: sticky;
  top: calc(var(--nav-h) + 32px);
  align-self: start;
}
.event-poster-wrap {
  width: 100%;
  border-radius: var(--radius-lg);
  overflow: hidden;
  flex-shrink: 0;
  background: oklch(22% 0.01 250);
}
.event-poster-wrap img {
  width: 100%;
  height: auto;
  display: block;
}
.event-poster-placeholder {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, oklch(22% 0.06 255) 0%, oklch(14% 0.04 270) 60%, oklch(18% 0.08 220) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}
.event-poster-placeholder svg {
  width: 80px;
  height: 80px;
  opacity: 0.22;
  color: #fff;
}

.event-content-col {
  display: flex;
  flex-direction: column;
  gap: 40px;
  padding-bottom: 40px;
}
.event-info {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.event-info-genre {
  display: inline-flex;
  align-items: center;
  padding: 4px 14px;
  background: var(--accent);
  color: #fff;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  width: fit-content;
}
.event-info-artist {
  font-family: var(--font-display);
  font-size: clamp(28px, 4vw, 42px);
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1.08;
  color: var(--fg);
}
.event-info-venue {
  font-size: 14px;
  color: var(--muted);
}
.event-info-meta {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}
.event-info-meta-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.event-info-meta-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.event-info-meta-value {
  font-size: 15px;
  font-weight: 600;
  color: var(--fg);
}
.event-info-meta-value.mono {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}
.event-info-actions {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}
.event-share-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
  font-family: var(--font-body);
}
.event-share-btn:hover { opacity: 0.85; }
.event-share-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.event-source-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  background: var(--surface);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.12s;
  font-family: var(--font-body);
  text-decoration: none;
}
.event-source-btn:hover { border-color: var(--fg); }
.event-source-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

.page {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 var(--gutter) clamp(48px, 8vw, 96px);
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 48px;
  align-items: start;
}

.event-main {
  padding-top: 40px;
}

.event-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
}
.event-title {
  font-family: var(--font-display);
  font-size: clamp(28px, 4vw, 48px);
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1.08;
  color: var(--fg);
  margin-bottom: 16px;
}
.event-subtitle {
  font-size: clamp(15px, 1.8vw, 17px);
  color: var(--muted);
  line-height: 1.65;
  margin-bottom: 36px;
}

.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 40px;
}
.meta-cell {
  background: var(--surface);
  padding: 18px 20px;
}
.meta-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.meta-value {
  font-size: 15px;
  font-weight: 600;
  color: var(--fg);
  letter-spacing: -0.01em;
}
.meta-value.mono {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}

.section-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}
.about-text {
  font-size: 15px;
  line-height: 1.75;
  color: var(--fg);
  margin-bottom: 32px;
}

.artist-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  gap: 16px;
  align-items: center;
  margin-bottom: 40px;
}
.artist-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.artist-avatar svg { width: 24px; height: 24px; color: var(--muted); }
.artist-avatar img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
.artist-name {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 3px;
}
.artist-meta { font-size: 13px; color: var(--muted); }

.map-block {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 0;
}
#map-container {
  width: 100%;
  height: 280px;
}
.map-loading {
  height: 280px;
  background: oklch(95% 0.003 240);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 13px;
}
.map-address {
  padding: 14px 16px;
  font-size: 14px;
  color: var(--fg);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.map-address svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--muted); }

.event-sidebar {
  padding-top: 40px;
  position: sticky;
  top: calc(var(--nav-h) + 24px);
}

.ticket-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px;
  margin-bottom: 16px;
}
.ticket-price-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.ticket-price-value {
  font-family: var(--font-display);
  font-size: clamp(28px, 3vw, 36px);
  font-weight: 700;
  letter-spacing: -0.04em;
  color: var(--fg);
  margin-bottom: 4px;
  font-variant-numeric: tabular-nums;
}
.ticket-price-note {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 24px;
}
.ticket-divider {
  height: 1px;
  background: var(--border);
  margin: 0 -28px 24px;
}

.ticket-meta-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 10px;
}
.ticket-meta-row:last-of-type { margin-bottom: 24px; }
.ticket-meta-key { color: var(--muted); }
.ticket-meta-val {
  font-weight: 500;
  color: var(--fg);
  text-align: right;
}

.ticket-org-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 13px 20px;
  background: var(--fg);
  color: var(--bg);
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
  text-decoration: none;
}
.ticket-org-btn:hover { opacity: 0.82; }
.ticket-org-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

.ticket-note {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  margin-top: 14px;
  line-height: 1.55;
}

.share-block {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.share-main-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
  font-family: var(--font-body);
}
.share-main-btn:hover { opacity: 0.85; }
.share-main-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

.share-url-row {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.share-url-row.visible { display: flex; }
.share-url-text {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.share-copy-btn {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 5px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: var(--surface);
  cursor: pointer;
  transition: all 0.12s;
}
.share-copy-btn:hover { border-color: var(--fg); color: var(--fg); }
.share-copy-btn svg { width: 13px; height: 13px; }

.share-org-link {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 16px;
  margin-top: 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  transition: all 0.12s;
  text-decoration: none;
}
.share-org-link:hover { border-color: var(--fg); color: var(--fg); }
.share-org-link svg { width: 13px; height: 13px; flex-shrink: 0; }

.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(6px);
  background: var(--fg);
  color: var(--bg);
  padding: 10px 22px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: opacity 0.18s, transform 0.18s;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.more-section {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 var(--gutter) clamp(48px, 8vw, 80px);
  border-top: 1px solid var(--border);
  padding-top: 40px;
}
.more-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 20px;
}
.more-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.03em;
}
.more-link {
  font-size: 13px;
  color: var(--accent);
  font-weight: 500;
}
.more-link:hover { text-decoration: underline; }

.more-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px;
}
.load-more-wrap {
  text-align: center;
  margin-top: 24px;
}
.load-more-btn {
  padding: 10px 28px;
  font-size: 14px;
  font-weight: 500;
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 100px;
  background: none;
  cursor: pointer;
  transition: all 0.12s;
}
.load-more-btn:hover {
  background: var(--accent);
  color: var(--surface);
}
.load-more-btn:disabled {
  opacity: 0.4;
  cursor: default;
  pointer-events: none;
}

.mini-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
  transition: border-color 0.12s, transform 0.15s;
  display: flex;
  flex-direction: column;
  text-decoration: none;
  color: inherit;
}
.mini-card:hover { border-color: oklch(80% 0.008 250); transform: translateY(-2px); }
.mini-img {
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
}
.mini-img svg { width: 28px; height: 28px; opacity: 0.3; color: #fff; }
.mini-img img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.mini-body { padding: 14px 16px; }
.mini-date {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 4px;
  font-variant-numeric: tabular-nums;
}
.mini-artist {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.25;
  margin-bottom: 4px;
}
.mini-venue { font-size: 12px; color: var(--muted); }

.pill { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
.pill-jazz    { background: oklch(58% 0.18 255 / 0.10); color: var(--accent); }
.pill-rock    { background: oklch(55% 0.15 15  / 0.10); color: oklch(50% 0.15 15); }
.pill-folk    { background: oklch(50% 0.12 150 / 0.10); color: oklch(46% 0.12 150); }
.pill-blues   { background: oklch(52% 0.14 270 / 0.10); color: oklch(50% 0.16 270); }
.pill-classic { background: oklch(52% 0.10 60  / 0.10); color: oklch(46% 0.10 60); }
.pill-pop     { background: oklch(58% 0.16 320 / 0.10); color: oklch(54% 0.16 320); }

.bg-jazz    { background: linear-gradient(135deg, oklch(22% 0.04 255), oklch(32% 0.08 255)); }
.bg-folk    { background: linear-gradient(135deg, oklch(24% 0.04 155), oklch(34% 0.08 145)); }
.bg-rock    { background: linear-gradient(135deg, oklch(22% 0.04 15),  oklch(32% 0.06 20)); }
.bg-blues   { background: linear-gradient(135deg, oklch(22% 0.06 270), oklch(30% 0.10 265)); }
.bg-classic { background: linear-gradient(135deg, oklch(28% 0.06 65),  oklch(36% 0.09 58)); }
.bg-pop     { background: linear-gradient(135deg, oklch(30% 0.10 325), oklch(40% 0.14 310)); }

.loading { text-align: center; padding: 80px 0; color: var(--muted); font-size: 15px; }

@media (max-width: 860px) {
  .event-hero-grid {
    grid-template-columns: 1fr;
    gap: 24px;
  }
  .event-poster-col {
    position: static;
  }
  .event-poster-wrap {
    max-width: 300px;
    margin: 0 auto;
  }
  .event-back { display: none; }
  .meta-grid {
    grid-template-columns: 1fr 1fr;
  }
}
@media (max-width: 600px) {
  .nav-genres, .nav-sep { display: none; }
  .genre-strip-mobile { display: flex; }
  .meta-grid {
    grid-template-columns: 1fr;
  }
  .more-grid {
    grid-template-columns: 1fr 1fr;
  }
}
@media (max-width: 400px) {
  .more-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<nav class="nav">
  <a href="index.html" class="nav-logo">местов<em>.нет</em></a>
  <div class="nav-sep"></div>
  <div class="nav-genres" id="nav-genres"></div>
</nav>

<div class="genre-strip-mobile" id="genre-strip-mobile"></div>

<div id="content"><div class="loading">Загрузка...</div></div>

<script>
const GENRE_MAP = {
  'джаз': 'jazz', 'рок': 'rock', 'русский рок': 'rock', 'панк-рок': 'rock',
  'инди-рок': 'rock', 'метал': 'rock', 'инди': 'rock', 'авторская': 'rock',
  'классика': 'classic', 'хоровая': 'classic', 'медитативная': 'classic',
  'поп': 'pop', 'поп-рок': 'pop', 'лаунж': 'pop', 'хип-хоп': 'pop',
  'каверы': 'pop', 'юмор': 'pop', 'шоу': 'pop', 'интерактив': 'pop',
  'этно': 'folk', 'фолк-метал': 'folk', 'народная': 'folk',
  'блюз': 'blues'
};

const GENRE_LABELS = {
  jazz: 'Джаз', rock: 'Рок', folk: 'Фолк', blues: 'Блюз', classic: 'Классика', pop: 'Поп'
};

const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const DOW_FULL = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];

const genreIcon = (g) => {
  const icons = {
    jazz: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
    rock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M8 12h8M12 8v8"/></svg>`,
    folk: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>`,
    blues: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
    classic: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>`,
    pop: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>`
  };
  return icons[g] || icons.jazz;
};

function mapGenre(raw) { return GENRE_MAP[raw?.toLowerCase()] || 'pop'; }

function parseDate(d) {
  const parts = d.split('-');
  return new Date(+parts[0], +parts[1] - 1, +parts[2]);
}

function priceText(p) {
  if (!p) return 'Вход свободный';
  const low = p.toLowerCase();
  if (low.includes('бесплат') || low === 'вход свободный') return 'Вход свободный';
  return p;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function handleShare() {
  const url = window.location.href;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => showToast('Ссылка скопирована'));
  }
  const urlRow = document.getElementById('shareUrlRow');
  const urlText = document.getElementById('shareUrlText');
  if (urlText) urlText.textContent = url;
  if (urlRow) urlRow.classList.add('visible');
}

function copyAgain() {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(window.location.href).then(() => showToast('Ссылка скопирована'));
  }
}

let allEvents = [];
let allUpcoming = [];
let currentEventIdx = -1;
let shownCount = 4;

async function load() {
  console.log('load started');
  const params = new URLSearchParams(window.location.search);
  const idx = parseInt(params.get('idx'));
  console.log('idx:', idx);

  try {
    const res = await fetch('events.json');
    console.log('fetch status:', res.status);
    const data = await res.json();
    console.log('data length:', data.length);
    allEvents = data.map((e, i) => ({ ...e, genre: mapGenre(e.genre), globalIdx: i }));
    const today = new Date(); today.setHours(0, 0, 0, 0);

    const upcoming = data
      .map((e, i) => ({ ...e, _origIdx: i }))
      .filter(e => e.date && parseDate(e.date) >= today)
      .map(e => ({
        ...e,
        dateObj: parseDate(e.date),
        genre: mapGenre(e.genre),
        dateFmt: {
          day: String(parseDate(e.date).getDate()).padStart(2, '0'),
          month: MONTHS_GEN[parseDate(e.date).getMonth()],
          monthShort: ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'][parseDate(e.date).getMonth()],
          dow: DOW_FULL[parseDate(e.date).getDay()],
          full: `${parseDate(e.date).getDate()} ${MONTHS_GEN[parseDate(e.date).getMonth()]} ${parseDate(e.date).getFullYear()}`
        },
        priceDisplay: priceText(e.price),
        globalIdx: e._origIdx
      }))
      .sort((a, b) => a.dateObj - b.dateObj || (a.time || '').localeCompare(b.time || ''));

    const event = upcoming.find(e => e.globalIdx === idx) || upcoming[0];
    if (!event) { document.getElementById('content').innerHTML = '<div class="loading">Событие не найдено</div>'; return; }

    currentEventIdx = event.globalIdx;
    allUpcoming = upcoming.filter(e => e.globalIdx !== currentEventIdx);
    shownCount = 4;

    renderNavGenres();
    render(event);
  } catch (err) {
    console.error('load error:', err);
    document.getElementById('content').innerHTML = '<div class="loading">Не удалось загрузить: ' + err.message + '</div>';
  }
}

function render(event) {
  document.title = `${event.artist || 'Мероприятие'} — Местов.Нет`;

  const posterHtml = event.image
    ? `<div class="event-poster-wrap"><img src="${event.image}" alt="${event.artist || ''}" loading="lazy"></div>`
    : `<div class="event-poster-wrap"><div class="event-poster-placeholder">${genreIcon(event.genre)}</div></div>`;

  const avatarImg = event.image
    ? `<img src="${event.image}" alt="${event.artist || ''}">`
    : genreIcon(event.genre);

  const visible = allUpcoming.slice(0, shownCount);
  const moreCards = visible.map(e => `
    <a href="event.html?idx=${e.globalIdx}" class="mini-card">
      <div class="mini-img bg-${e.genre}">${e.image ? `<img src="${e.image}" alt="${e.artist || ''}" loading="lazy">` : genreIcon(e.genre)}</div>
      <div class="mini-body">
        <div class="mini-date">${e.dateFmt.day} ${e.dateFmt.monthShort} · ${e.time || '—'}</div>
        <div class="mini-artist">${e.artist || '—'}</div>
        <div class="mini-venue">${e.venue || '—'} · ${e.source_city || '—'}</div>
      </div>
    </a>
  `).join('');

  const html = `
    <div class="event-hero">
      <div class="event-hero-inner">
        <a href="javascript:history.back()" class="event-back">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3L5 8l5 5"/>
          </svg>
          Назад
        </a>
        <div class="event-hero-grid">
          <div class="event-poster-col">${posterHtml}</div>
          <div class="event-content-col">
          <div class="event-info">
            <span class="event-info-genre">${GENRE_LABELS[event.genre]}</span>
            <h1 class="event-info-artist">${event.artist || '—'}</h1>
            <div class="event-info-venue">${event.venue || '—'} · ${event.source_city || '—'}</div>
            <div class="event-info-meta">
              <div class="event-info-meta-item">
                <span class="event-info-meta-label">Дата</span>
                <span class="event-info-meta-value">${event.dateFmt.full}</span>
              </div>
              <div class="event-info-meta-item">
                <span class="event-info-meta-label">Начало</span>
                <span class="event-info-meta-value mono">${event.time || '—'}</span>
              </div>
              <div class="event-info-meta-item">
                <span class="event-info-meta-label">Стоимость</span>
                <span class="event-info-meta-value">${event.priceDisplay}</span>
              </div>
            </div>
            <div class="event-info-actions">
              <button class="event-share-btn" onclick="handleShare()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                  <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                </svg>
                Поделиться
              </button>
              <a href="${event.source_url || '#'}" target="_blank" rel="noopener" class="event-source-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                  <polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/>
                </svg>
                Источник
              </a>
            </div>
          </div>

          <div class="event-main">
            <div class="section-label">О мероприятии</div>
            <p class="about-text">${event.description || 'Информация уточняется.'}</p>

            <div class="section-label">Исполнитель</div>
            <div class="artist-card">
              <div class="artist-avatar">${avatarImg}</div>
              <div>
                <div class="artist-name">${event.artist || '—'}</div>
                <div class="artist-meta"><span class="pill pill-${event.genre}">${GENRE_LABELS[event.genre]}</span></div>
              </div>
            </div>

            <div class="section-label">Место проведения</div>
            <div class="map-block" id="map-block">
              <div class="map-loading">Загрузка карты...</div>
              <div class="map-address">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
                  <circle cx="12" cy="9" r="2.5"/>
                </svg>
                ${event.venue || '—'}, ${event.source_city || '—'}
              </div>
            </div>
          </div>
        </div>
        </div>
      </div>
    </div>

    <div class="more-section">
      <div class="more-header">
        <div class="more-title">Другие мероприятия</div>
      </div>
      <div class="more-grid" id="more-grid">${moreCards}</div>
      <div class="load-more-wrap">
        <button class="load-more-btn" id="load-more-btn" onclick="loadMore()">Показать ещё</button>
      </div>
    </div>
  `;

  document.getElementById('content').innerHTML = html;
  updateLoadMoreBtn();
  loadMap(event.venue, event.source_city);
}

async function loadMap(venue, city) {
  console.log('loadMap called:', venue, city);
  const block = document.getElementById('map-block');
  if (!block) { console.log('no map-block'); return; }
  if (!venue || !city) { console.log('no venue/city'); return; }
  try {
    const q = encodeURIComponent(`${venue}, ${city}, Крым`);
    console.log('nominatim query:', q);
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1&accept-language=ru`);
    console.log('nominatim status:', res.status);
    const data = await res.json();
    console.log('nominatim data:', data);
    if (data.length) {
      const { lat, lon } = data[0];
      console.log('coords:', lat, lon);
      block.querySelector('.map-loading').outerHTML = `<iframe class="map-iframe" src="https://yandex.ru/map-widget/v1/?ll=${lon},${lat}&z=16&l=map&pt=${lon},${lat},pm2rdm" allowfullscreen loading="lazy" style="width:100%;height:280px;border:none;display:block;"></iframe>`;
    } else {
      console.log('no results, fallback');
      block.querySelector('.map-loading').outerHTML = `<iframe class="map-iframe" src="https://yandex.ru/map-widget/v1/?text=${q}&z=14&l=map" allowfullscreen loading="lazy" style="width:100%;height:280px;border:none;display:block;"></iframe>`;
    }
  } catch (e) {
    console.error('loadMap error:', e);
    block.querySelector('.map-loading').outerHTML = `<iframe class="map-iframe" src="https://yandex.ru/map-widget/v1/?text=${encodeURIComponent(venue + ', ' + city)}&z=14&l=map" allowfullscreen loading="lazy" style="width:100%;height:280px;border:none;display:block;"></iframe>`;
  }
}
function loadMore() {
  shownCount += 8;
  renderMoreCards();
  updateLoadMoreBtn();
}

function renderMoreCards() {
  const visible = allUpcoming.slice(0, shownCount);
  const moreCards = visible.map(e => `
    <a href="event.html?idx=${e.globalIdx}" class="mini-card">
      <div class="mini-img bg-${e.genre}">${e.image ? `<img src="${e.image}" alt="${e.artist || ''}" loading="lazy">` : genreIcon(e.genre)}</div>
      <div class="mini-body">
        <div class="mini-date">${e.dateFmt.day} ${e.dateFmt.monthShort} · ${e.time || '—'}</div>
        <div class="mini-artist">${e.artist || '—'}</div>
        <div class="mini-venue">${e.venue || '—'} · ${e.source_city || '—'}</div>
      </div>
    </a>
  `).join('');
  document.getElementById('more-grid').innerHTML = moreCards;
}

function updateLoadMoreBtn() {
  const btn = document.getElementById('load-more-btn');
  if (!btn) return;
  if (shownCount >= allUpcoming.length) {
    btn.disabled = true;
    btn.textContent = 'Все загружены';
  } else {
    btn.disabled = false;
    btn.textContent = `Показать ещё (${allUpcoming.length - shownCount})`;
  }
}

function renderNavGenres() {
  const counts = {};
  allEvents.forEach(e => { counts[e.genre] = (counts[e.genre] || 0) + 1; });
  const order = ['jazz', 'rock', 'folk', 'blues', 'classic', 'pop'];
  const active = order.filter(g => counts[g]);

  const navHtml = active.map(g =>
    `<a href="genre.html?g=${g}" class="nav-genre">${GENRE_LABELS[g]}</a>`
  ).join('');
  document.getElementById('nav-genres').innerHTML = navHtml;

  const mobileHtml = active.map(g =>
    `<a href="genre.html?g=${g}">${GENRE_LABELS[g]}</a>`
  ).join('');
  document.getElementById('genre-strip-mobile').innerHTML = mobileHtml;
}

load();
</script>

</html>
