name: Reels cloud acceptance
on:
  push:
    branches: ['codex/reels-reliability']
    paths: ['social/**', '.github/workflows/reels-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reels-cloud-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /social/reels.py
            /social/reel_module.py
            /social/reel_composition.py
            /social/reel_delivery.py
            /social/reel_job.py
            /social/build_cloud_fixture.py
            /social/templates/photo-led-a2.local.json
            /social/assets/vinyl.png
            /social/tests/test_reels_pipeline.py
            /social/tests/test_reels_reliability.py
            /social/tests/test_reel_delivery.py
            /social/tests/test_reel_job.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render dependencies
        run: |
          command -v ffmpeg || brew install ffmpeg
          python -m pip install Pillow pytest
      - name: Locate installed Avenir without distributing a system font
        run: |
          mkdir -p output
          python - <<'PY'
          import os,json,hashlib,shutil
          from pathlib import Path
          matches=list(Path('/System/Library/Fonts').rglob('Avenir Next.ttc'))
          if not matches:
              raise SystemExit('Runner has no installed Avenir Next; no font substitution allowed')
          target=Path(os.environ['RUNNER_TEMP'])/'reels-avenir.ttc'
          shutil.copyfile(matches[0],target)
          Path('output/runtime.json').write_text(json.dumps({'font_sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'runner_os':os.environ['RUNNER_OS'],'font_source':'installed_on_remote_runner'},indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('REELS_FONT='+str(target)+'\n')
          PY
      - name: Regression tests
        run: python -m pytest social/tests -q --junitxml=output/tests.xml
      - name: Render isolated archive job (no queue or publication)
        run: |
          python -m social.build_cloud_fixture --output output/job
          python -m social.reel_job render --job output/job --output output/render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reels-cloud-acceptance
          path: output/
          retention-days: 30
