name: Parser daily

# Запускает parser.py раз в день ночью (01:00 UTC = 04:00 Крым),
# генерирует страницы, пушит изменения в main, дожидается деплоя
# и только после этого присылает Telegram-уведомление.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Глубина парсинга в днях"
        required: false
        default: "14"
        type: string

concurrency:
  group: site-publication
  cancel-in-progress: false

jobs:
  parse-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      deploy_ref: ${{ steps.commit.outputs.deploy_ref }}
    permissions:
      contents: write
      actions: write
    env:
      VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
      MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MODERATION_WORKER_URL: ${{ secrets.MODERATION_WORKER_URL }}
      MODERATION_SYNC_TOKEN: ${{ secrets.MODERATION_SYNC_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          pip install -r requirements.txt

      - name: Снимок реестров «до»
        run: |
          mkdir -p /tmp/before
          cp events.json venues.json artists.json /tmp/before/

      - name: Сохранить снимок для отложенного уведомления
        uses: actions/upload-artifact@v4
        with:
          name: registries-before
          path: /tmp/before/
          retention-days: 1

      - name: Запустить парсер
        run: |
          DAYS="${{ github.event.inputs.days || 14 }}"
          python parser.py --days "$DAYS" | tee parser_output.log
          python source_health.py --log parser_output.log
          python repair_event_data.py
          python moderation_queue.py

      - name: Пересобрать реестры артистов и заведений
        run: |
          python build_venues.py
          python build_artists.py

      - name: Сгенерировать страницы
        run: |
          python generate_pages.py

      - name: Закоммитить и запушить
        id: commit
        run: |
          git config user.name "MestovNet Bot"
          git config user.email "mestovnet-bot@users.noreply.github.com"

          # Коммитим только если есть изменения
          if git diff --quiet; then
            echo "Нет изменений — коммитить нечего."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "deploy_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          COUNT=$(python3 -c "import json; d=json.load(open('events.json')); print(len(d))")
          git commit -m "parser: обновить события [автоматически] ($COUNT в базе)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "deploy_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"


  # Reusable workflow позволяет дождаться не только запуска, но и
  # фактического завершения деплоя перед Telegram-уведомлением.
  deploy:
    needs: parse-and-deploy
    if: needs.parse-and-deploy.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-yandex.yml
    with:
      deploy_ref: ${{ needs.parse-and-deploy.outputs.deploy_ref }}
    secrets: inherit

  notify:
    needs: [parse-and-deploy, deploy]
    # Отчёт должен прийти даже тогда, когда парсер, тесты или деплой упали.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout уже опубликованной версии
        if: >-
          ${{ needs.parse-and-deploy.result == 'success' &&
              (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Установить Python
        if: >-
          ${{ needs.parse-and-deploy.result == 'success' &&
              (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        if: >-
          ${{ needs.parse-and-deploy.result == 'success' &&
              (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
        run: pip install -r requirements.txt

      - name: Загрузить снимок реестров «до»
        if: >-
          ${{ needs.parse-and-deploy.result == 'success' &&
              (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
        uses: actions/download-artifact@v4
        with:
          name: registries-before
          path: /tmp/before

      - name: Отправить уведомление в Telegram
        id: regular_notification
        if: >-
          ${{ needs.parse-and-deploy.result == 'success' &&
              (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_new.py --before-dir /tmp/before --notify-empty
        continue-on-error: true

      - name: Отправить очередь модерации в Telegram
        if: >-
          ${{ needs.parse-and-deploy.result == 'success' &&
              (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python moderation_notify.py
        continue-on-error: true

      - name: Сообщить о проблемах источников в Telegram
        if: >-
          ${{ needs.parse-and-deploy.result == 'success' &&
              (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python source_health_notify.py
        continue-on-error: true

      - name: Сообщить об ошибке ночного запуска
        if: >-
          ${{ needs.parse-and-deploy.result != 'success' ||
              (needs.deploy.result != 'success' && needs.deploy.result != 'skipped') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PARSER_RESULT: ${{ needs.parse-and-deploy.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          parser_result = os.environ["PARSER_RESULT"]
          deploy_result = os.environ["DEPLOY_RESULT"]
          if parser_result != "success":
              problem = f"парсер завершился со статусом {parser_result}"
          else:
              problem = f"парсер отработал, но проверка/деплой завершились со статусом {deploy_result}"

          text = (
              "⚠️ <b>Ночной запуск Местов.Нет завершился с ошибкой</b>\n\n"
              f"{problem}. Изменения на сайте могли не опубликоваться.\n"
              f'<a href="{os.environ["RUN_URL"]}">Открыть логи запуска</a>'
          )
          data = json.dumps({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
          }).encode()
          request = urllib.request.Request(
              f'https://api.telegram.org/bot{os.environ["TELEGRAM_BOT_TOKEN"]}/sendMessage',
              data=data,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise RuntimeError(f"Telegram вернул HTTP {response.status}")
          PY

      - name: Сообщить, что основной Telegram-отчёт не отправился
        if: ${{ steps.regular_notification.outcome == 'failure' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          text = (
              "⚠️ <b>Ночной запуск Местов.Нет завершён, но подробный отчёт не сформирован</b>\n\n"
              f'<a href="{os.environ["RUN_URL"]}">Открыть логи запуска</a>'
          )
          data = json.dumps({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
          }).encode()
          request = urllib.request.Request(
              f'https://api.telegram.org/bot{os.environ["TELEGRAM_BOT_TOKEN"]}/sendMessage',
              data=data,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise RuntimeError(f"Telegram вернул HTTP {response.status}")
          PY
