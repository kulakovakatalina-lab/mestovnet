name: Deploy to Yandex Object Storage

# Заливает статику сайта в бакет mestov.net при каждом пуше в main,
# а также вручную (кнопка Run workflow на вкладке Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Чтобы одновременно не запускались две заливки
concurrency:
  group: deploy-yandex
  cancel-in-progress: true

jobs:
  # Автотесты перед релизом: вёрстка, ссылки, соответствие постеров событиям,
  # sitemap/robots. Гоняем только новые pre-release тесты, а не весь tests/ —
  # там есть отдельный (уже существующий и пока не пройденный) набор юнит-
  # тестов парсера, который к релизу сайта не относится.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Установить браузер для Playwright
        run: playwright install --with-deps chromium

      - name: Прогнать все тесты
        run: pytest tests/ -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1
      ENDPOINT: https://storage.yandexcloud.net
      BUCKET: s3://mestov.net
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Собрать чистую папку сайта (только нужные файлы)
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          # Файлы в корне
          cp index.html event.html genre.html map.html admin.html 404.html _site/
          cp events.json settings.json venues.json cities.json _site/
          cp sitemap.xml robots.txt _site/
          cp yandex_c7b51fb2f9cdb188.html _site/
          # Папки целиком
          cp -r cities _site/
          cp -r genre _site/
          cp -r images _site/
          cp -r venues _site/
          cp -r event _site/
          echo "--- содержимое _site ---"
          ls -R _site | head -50

      - name: Залить ассеты (картинки) с долгим кэшем
        run: |
          aws s3 sync _site/images "$BUCKET/images" \
            --endpoint-url "$ENDPOINT" \
            --delete \
            --cache-control "public, max-age=2592000"

      - name: Залить HTML/JSON с коротким кэшем
        run: |
          aws s3 sync _site "$BUCKET" \
            --endpoint-url "$ENDPOINT" \
            --delete \
            --exclude "images/*" \
            --exclude "venues/*" \
            --exclude "event/*" \
            --cache-control "public, max-age=300"

      - name: Залить страницы заведений (venues/) с явным Content-Type)
        run: |
          aws s3 sync _site/venues "$BUCKET/venues" \
            --endpoint-url "$ENDPOINT" \
            --delete \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=300"

      - name: Залить страницы событий (event/) с явным Content-Type
        run: |
          aws s3 sync _site/event "$BUCKET/event" \
            --endpoint-url "$ENDPOINT" \
            --delete \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=300"

      # Настройка хостинга бакета: главная — index.html, ошибки — 404.html.
      # Идемпотентно: безопасно выполнять при каждом деплое.
      - name: Настроить документы веб-сайта (index + 404)
        run: |
          aws s3api put-bucket-website \
            --bucket mestov.net \
            --endpoint-url "$ENDPOINT" \
            --website-configuration '{"IndexDocument":{"Suffix":"index.html"},"ErrorDocument":{"Key":"404.html"}}'

      # Smoke-проверка прода: если что-то сломано — прогон красный.
      # ?v=RUN_ID обходит 5-минутный кэш CDN, чтобы проверялась свежая версия.
      - name: Проверить сайт после деплоя
        run: |
          set -e
          SITE="https://mestov.net"
          V="?v=${{ github.run_id }}"

          echo "1) Главная отвечает и содержит контент"
          curl -sfSL "$SITE/$V" -o /tmp/home.html
          grep -qi "местов" /tmp/home.html || { echo "FAIL: на главной нет названия сайта"; exit 1; }

          echo "2) events.json валиден и не пустой"
          curl -sfSL "$SITE/events.json$V" -o /tmp/events.json
          python3 -c "
          import json
          events = json.load(open('/tmp/events.json'))
          assert isinstance(events, list) and len(events) > 0, 'events.json пуст'
          print(f'OK: {len(events)} событий')
          "

          echo "3) Первая страница события из sitemap открывается"
          EVENT_URL=$(curl -sfSL "$SITE/sitemap.xml$V" | grep -o 'https://mestov.net/event/[^<]*' | head -1)
          if [ -n "$EVENT_URL" ]; then
            curl -sfSL "$EVENT_URL$V" -o /tmp/event.html
            grep -qi "местов" /tmp/event.html || { echo "FAIL: страница события пустая: $EVENT_URL"; exit 1; }
            echo "OK: $EVENT_URL"
          else
            echo "В sitemap нет страниц событий — пропускаю"
          fi

          echo "4) Страница города открывается"
          curl -sfSL "$SITE/cities/sevastopol.html$V" -o /tmp/city.html
          grep -qi "местов" /tmp/city.html || { echo "FAIL: страница города пустая"; exit 1; }

          echo "4b) Страница жанра открывается"
          curl -sfSL "$SITE/genre/jazz/$V" -o /tmp/genre.html
          grep -qi "местов" /tmp/genre.html || { echo "FAIL: страница жанра пустая"; exit 1; }

          echo "5) Страница 404 на месте и закрыта от индексации"
          curl -sfSL "$SITE/404.html$V" -o /tmp/404.html
          grep -qi "noindex" /tmp/404.html || { echo "FAIL: в 404.html нет noindex"; exit 1; }

          echo "6) Страница карты открывается"
          curl -sfSL "$SITE/map.html$V" -o /tmp/map.html
          grep -qi "местов" /tmp/map.html || { echo "FAIL: страница карты пустая"; exit 1; }

          echo "Все проверки прошли ✅"
