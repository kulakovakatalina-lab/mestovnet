name: Publish moderation decision

# Worker запускает workflow сразу после одобрения или отклонения карточки.
on:
  workflow_dispatch:

concurrency:
  # Не пересекаться с ночным парсером: оба процесса меняют main.
  group: site-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      deploy_ref: ${{ steps.commit.outputs.deploy_ref }}
    env:
      MODERATION_WORKER_URL: ${{ secrets.MODERATION_WORKER_URL }}
      MODERATION_SYNC_TOKEN: ${{ secrets.MODERATION_SYNC_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify moderation sync
        run: |
          python - <<'PY'
          from moderation_queue import load_decisions

          if load_decisions() is None:
              raise SystemExit("Cannot read moderation decisions from Worker")
          PY

      - name: Apply moderation decision
        run: |
          python moderation_queue.py
          python build_venues.py
          python build_artists.py
          python generate_pages.py

      - name: Commit and publish if changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "Decision was already published; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "MestovNet Bot"
          git config user.email "mestovnet-bot@users.noreply.github.com"
          git add -A
          git commit -m "moderation: publish decision"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "deploy_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: needs.publish.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-yandex.yml
    with:
      deploy_ref: ${{ needs.publish.outputs.deploy_ref }}
    secrets: inherit
