<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка — Местов.Нет</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
    }

    /* ---- auth screen ---- */
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
      padding: 24px;
    }

    #auth-screen h2 { font-size: 1.1rem; color: #aaa; }

    #auth-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 300px;
    }

    #auth-form input {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #f0f0f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    #auth-form input:focus { border-color: #555; }

    #auth-form button {
      background: #fff;
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    #auth-error {
      color: #bb7777;
      font-size: 0.85rem;
      display: none;
    }

    /* ---- admin app ---- */
    #app { display: none; }

    header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 { font-size: 1.3rem; font-weight: 700; }
    header a { color: #4a7aaa; font-size: 0.85rem; text-decoration: none; }
    header a:hover { color: #7aaadd; }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0f0f0f;
      border-bottom: 1px solid #222;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stats {
      font-size: 0.82rem;
      color: #666;
      margin-right: auto;
    }
    .stats b { color: #f0f0f0; }

    .toolbar-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #aaa;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .toolbar-btn:hover { border-color: #555; color: #fff; }
    .toolbar-btn.danger { border-color: #4a2222; color: #bb7777; }
    .toolbar-btn.danger:hover { border-color: #aa4444; color: #ffaaaa; background: #1a1010; }
    .toolbar-btn:disabled { opacity: 0.45; cursor: default; }

    .search-wrap {
      position: relative;
    }
    .search-wrap input {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #f0f0f0;
      padding: 6px 12px 6px 32px;
      border-radius: 20px;
      font-size: 0.82rem;
      outline: none;
      width: 200px;
      transition: border-color 0.15s, width 0.2s;
    }
    .search-wrap input:focus { border-color: #555; width: 260px; }
    .search-wrap::before {
      content: "⌕";
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #555;
      font-size: 1rem;
      pointer-events: none;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px;
    }

    .date-group h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #555;
      margin-bottom: 8px;
      margin-top: 28px;
    }
    .date-group:first-child h2 { margin-top: 0; }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #222;
      background: #151515;
      margin-bottom: 5px;
      transition: border-color 0.15s, opacity 0.2s;
    }

    .row.hidden-row { opacity: 0.4; }
    .row.hidden-row .row-artist { text-decoration: line-through; color: #555; }
    .row.search-hidden { display: none; }

    .row-time-wrap {
      width: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .row-time {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    .row-time.no-time {
      color: #3a3a3a;
      font-size: 0.75rem;
      font-weight: 400;
      cursor: pointer;
      transition: color 0.15s;
    }
    .row-time.no-time:hover { color: #777; }

    .row-time.custom-time {
      color: #d4a84b;
      cursor: pointer;
      transition: color 0.15s;
    }
    .row-time.custom-time:hover { color: #f0c060; }

    .time-del {
      background: none;
      border: none;
      color: #3a3a3a;
      font-size: 0.9rem;
      line-height: 1;
      cursor: pointer;
      padding: 0 1px;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .time-del:hover { color: #bb7777; }

    .time-input {
      background: #1a1a1a;
      border: 1px solid #4a4a4a;
      border-radius: 5px;
      color: #f0f0f0;
      font-size: 0.78rem;
      padding: 2px 4px;
      width: 58px;
      outline: none;
      transition: border-color 0.15s;
    }
    .time-input:focus { border-color: #d4a84b; }

    .row-info {
      flex: 1;
      min-width: 0;
    }

    .row-artist {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e0e0e0;
      cursor: pointer;
    }

    .row-artist:hover { color: #fff; text-decoration: underline dotted #555; }
    .row-artist.custom-name { color: #7db87d; }
    .row-artist.custom-name:hover { color: #a0d4a0; }

    .name-input {
      background: #1a1a1a;
      border: 1px solid #4a4a4a;
      border-radius: 5px;
      color: #f0f0f0;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 2px 6px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    .name-input:focus { border-color: #7db87d; }

    .row-meta {
      font-size: 0.75rem;
      color: #555;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* toggle switch */
    .toggle-wrap {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-label {
      font-size: 0.75rem;
      color: #555;
      width: 38px;
      text-align: right;
    }
    .toggle-label.on { color: #77bb77; }

    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #2a2a2a;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid #333;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      background: #555;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    input:checked + .slider { background: #1a3a1a; border-color: #2a5a2a; }
    input:checked + .slider::before { transform: translateX(18px); background: #77cc77; }

    .empty { text-align: center; color: #555; padding: 60px 0; font-size: 0.95rem; }

    @media (max-width: 480px) {
      header { padding: 16px; }
      .toolbar { padding: 10px 16px; gap: 8px; }
      .search-wrap input { width: 140px; }
      .search-wrap input:focus { width: 180px; }
      main { padding: 12px; }
    }
  </style>
</head>
<body>

<!-- экран входа -->
<div id="auth-screen">
  <h2>Вход в админку</h2>
  <form id="auth-form">
    <input type="password" id="pwd-input" placeholder="Пароль" autocomplete="current-password">
    <button type="submit">Войти</button>
    <span id="auth-error">Неверный пароль</span>
  </form>
</div>

<!-- интерфейс админки -->
<div id="app">
  <header>
    <h1>Админка Местов.Нет</h1>
    <a href="index.html">← На сайт</a>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Поиск…">
    </div>
    <div class="stats" id="stats"></div>
    <button class="toolbar-btn" id="btn-show-all">Показать всё</button>
    <button class="toolbar-btn" id="btn-save" disabled>Сохранено ✓</button>
    <button class="toolbar-btn" id="btn-token">🔑 Токен</button>
    <button class="toolbar-btn" id="btn-export">Экспорт</button>
    <label class="toolbar-btn" id="btn-import-label">Импорт<input type="file" id="btn-import" accept=".json" style="display:none"></label>
    <button class="toolbar-btn danger" id="btn-logout">Выйти</button>
  </div>

  <main id="main"></main>
</div>

<script>
// ---- конфигурация ----
const GITHUB_REPO   = "kulakovakatalina-lab/mestovnet";
const GITHUB_BRANCH = "main";
const GITHUB_FILE   = "settings.json";

const PASSWORD    = "admin1234";
const SESSION_KEY = "mestovnet_admin_auth";
const TOKEN_KEY   = "mestovnet_github_token";

// ---- auth ----
function checkAuth() {
  return sessionStorage.getItem(SESSION_KEY) === "1";
}

document.getElementById("auth-form").addEventListener("submit", e => {
  e.preventDefault();
  const val = document.getElementById("pwd-input").value;
  if (val === PASSWORD) {
    sessionStorage.setItem(SESSION_KEY, "1");
    showApp();
  } else {
    document.getElementById("auth-error").style.display = "block";
    document.getElementById("pwd-input").value = "";
  }
});

document.getElementById("btn-logout").addEventListener("click", () => {
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
});

// ---- состояние ----
let EVENTS = [];
let hidden = new Set();
let times  = {};
let names  = {};
let dirty  = false;

const MONTHS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const DAYS = ["вс","пн","вт","ср","чт","пт","сб"];

// ---- GitHub API ----
function getToken() {
  return localStorage.getItem(TOKEN_KEY) || "";
}

function updateTokenBtn() {
  const btn = document.getElementById("btn-token");
  if (!btn) return;
  const has = !!getToken();
  btn.textContent = has ? "🔑 Токен ✓" : "🔑 Токен";
  btn.style.borderColor = has ? "#2a5a2a" : "";
  btn.style.color = has ? "#77cc77" : "";
}

function markDirty() {
  dirty = true;
  updateSaveBtn();
}

function updateSaveBtn() {
  const btn = document.getElementById("btn-save");
  if (!btn) return;
  btn.disabled = !dirty;
  btn.textContent = dirty ? "Сохранить изменения" : "Сохранено ✓";
  btn.style.borderColor = dirty ? "#2a5a5a" : "";
  btn.style.color = dirty ? "#77cccc" : "";
}

async function pushSettings() {
  const token = getToken();
  if (!token) {
    alert("Сначала введите GitHub токен (кнопка «🔑 Токен»).\n\nСоздайте токен на github.com → Settings → Developer settings → Personal access tokens → Fine-grained tokens.\nНужен доступ: Contents (Read and write) для репозитория mestovnet.");
    return;
  }

  const btn = document.getElementById("btn-save");
  btn.textContent = "Сохранение…";
  btn.disabled = true;

  const content = { hidden: [...hidden], times, names };
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2))));

  try {
    const apiUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`;
    const headers = {
      Authorization: `token ${token}`,
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json"
    };

    const body = {
      message: "Admin: обновить настройки",
      content: encoded,
      branch: GITHUB_BRANCH
    };

    // получаем SHA текущего файла (нужен для обновления)
    const metaRes = await fetch(`${apiUrl}?ref=${GITHUB_BRANCH}`, { headers });
    if (metaRes.ok) {
      const meta = await metaRes.json();
      body.sha = meta.sha;
    }

    const res = await fetch(apiUrl, { method: "PUT", headers, body: JSON.stringify(body) });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `HTTP ${res.status}`);
    }

    dirty = false;
    updateSaveBtn();
  } catch(e) {
    alert("Ошибка сохранения: " + e.message);
    btn.textContent = "Сохранить изменения";
    btn.disabled = false;
  }
}

async function loadSettings() {
  try {
    const res = await fetch(`settings.json?_=${Date.now()}`);
    if (res.ok) {
      const d = await res.json();
      hidden = new Set(d.hidden || []);
      times  = d.times  || {};
      names  = d.names  || {};
    }
  } catch { /* оставляем пустые defaults */ }
}

// ---- форматирование ----
function formatDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${DAYS[d.getDay()]}`;
}

function updateStats() {
  const total = EVENTS.length;
  const hiddenCount = EVENTS.filter(e => hidden.has(e.source_url)).length;
  document.getElementById("stats").innerHTML =
    `всего <b>${total}</b> &nbsp;·&nbsp; скрыто <b>${hiddenCount}</b>`;
}

function render() {
  const main = document.getElementById("main");
  main.innerHTML = "";

  const groups = {};
  EVENTS.forEach(e => {
    const key = e.date || "no-date";
    if (!groups[key]) groups[key] = [];
    groups[key].push(e);
  });

  const sortedKeys = Object.keys(groups).sort((a, b) => {
    if (a === "no-date") return 1;
    if (b === "no-date") return -1;
    return a.localeCompare(b);
  });

  sortedKeys.forEach(key => {
    const group = document.createElement("div");
    group.className = "date-group";

    const h2 = document.createElement("h2");
    h2.textContent = key === "no-date" ? "Дата уточняется" : formatDate(key);
    group.appendChild(h2);

    const sorted = groups[key].slice().sort((a, b) => {
      if (a.time && b.time) return a.time.localeCompare(b.time);
      if (a.time) return -1;
      if (b.time) return 1;
      return 0;
    });

    sorted.forEach(event => group.appendChild(makeRow(event)));
    main.appendChild(group);
  });

  updateStats();
}

function renderTimeContent(wrap, e) {
  wrap.innerHTML = "";

  if (e.time) {
    const span = document.createElement("span");
    span.className = "row-time";
    span.textContent = e.time;
    wrap.appendChild(span);
    return;
  }

  const custom = times[e.source_url];

  if (custom) {
    const span = document.createElement("span");
    span.className = "row-time custom-time";
    span.textContent = custom;
    span.title = "Изменить время";
    span.addEventListener("click", () => showTimeInput(wrap, e));
    wrap.appendChild(span);

    const del = document.createElement("button");
    del.className = "time-del";
    del.textContent = "×";
    del.title = "Удалить время";
    del.addEventListener("click", ev => {
      ev.stopPropagation();
      delete times[e.source_url];
      markDirty();
      renderTimeContent(wrap, e);
    });
    wrap.appendChild(del);
  } else {
    const dash = document.createElement("span");
    dash.className = "row-time no-time";
    dash.textContent = "＋";
    dash.title = "Добавить время";
    dash.addEventListener("click", () => showTimeInput(wrap, e));
    wrap.appendChild(dash);
  }
}

function showTimeInput(wrap, e) {
  wrap.innerHTML = "";
  const input = document.createElement("input");
  input.type = "time";
  input.className = "time-input";
  input.value = times[e.source_url] || "";
  wrap.appendChild(input);
  input.focus();

  function commit() {
    const val = input.value;
    if (val) {
      times[e.source_url] = val;
    } else {
      delete times[e.source_url];
    }
    markDirty();
    renderTimeContent(wrap, e);
  }

  input.addEventListener("blur", commit);
  input.addEventListener("keydown", ev => {
    if (ev.key === "Enter") { ev.preventDefault(); input.blur(); }
    if (ev.key === "Escape") { renderTimeContent(wrap, e); }
  });
}

function renderArtistContent(wrap, e) {
  wrap.innerHTML = "";
  const custom = names[e.source_url];
  const span = document.createElement("span");
  span.className = "row-artist" + (custom ? " custom-name" : "");
  span.textContent = custom || e.artist || e.venue || "";
  span.title = "Нажмите чтобы изменить название";
  span.addEventListener("click", () => showNameInput(wrap, e));
  wrap.appendChild(span);
}

function showNameInput(wrap, e) {
  wrap.innerHTML = "";
  const input = document.createElement("input");
  input.type = "text";
  input.className = "name-input";
  input.value = names[e.source_url] || e.artist || e.venue || "";
  wrap.appendChild(input);
  input.focus();
  input.select();

  function commit() {
    const val = input.value.trim();
    const original = (e.artist || e.venue || "").trim();
    if (val && val !== original) {
      names[e.source_url] = val;
    } else {
      delete names[e.source_url];
    }
    markDirty();
    renderArtistContent(wrap, e);
  }

  input.addEventListener("blur", commit);
  input.addEventListener("keydown", ev => {
    if (ev.key === "Enter") { ev.preventDefault(); input.blur(); }
    if (ev.key === "Escape") { renderArtistContent(wrap, e); }
  });
}

function makeRow(e) {
  const isHidden = hidden.has(e.source_url);

  const row = document.createElement("div");
  row.className = "row" + (isHidden ? " hidden-row" : "");
  row.dataset.artist = (e.artist || e.venue || "").toLowerCase();
  row.dataset.venue  = (e.venue || "").toLowerCase();
  row.dataset.city   = (e.source_city || "").toLowerCase();

  const timeWrap = document.createElement("div");
  timeWrap.className = "row-time-wrap";
  renderTimeContent(timeWrap, e);
  row.appendChild(timeWrap);

  const info = document.createElement("div");
  info.className = "row-info";

  const artistWrap = document.createElement("div");
  renderArtistContent(artistWrap, e);
  info.appendChild(artistWrap);

  const meta = document.createElement("div");
  meta.className = "row-meta";
  const parts = [];
  if (e.venue && e.artist) parts.push(e.venue);
  if (e.source_city) parts.push(e.source_city);
  if (e.event_type) parts.push(e.event_type);
  meta.textContent = parts.join(" · ");
  info.appendChild(meta);

  row.appendChild(info);

  const wrap = document.createElement("div");
  wrap.className = "toggle-wrap";

  const label = document.createElement("span");
  label.className = isHidden ? "toggle-label" : "toggle-label on";
  label.textContent = isHidden ? "скрыто" : "видно";

  const sw = document.createElement("label");
  sw.className = "switch";

  const input = document.createElement("input");
  input.type = "checkbox";
  input.checked = !isHidden;
  input.addEventListener("change", () => {
    if (input.checked) {
      hidden.delete(e.source_url);
      row.classList.remove("hidden-row");
      label.className = "toggle-label on";
      label.textContent = "видно";
    } else {
      hidden.add(e.source_url);
      row.classList.add("hidden-row");
      label.className = "toggle-label";
      label.textContent = "скрыто";
    }
    markDirty();
    updateStats();
  });

  const slider = document.createElement("span");
  slider.className = "slider";

  sw.appendChild(input);
  sw.appendChild(slider);
  wrap.appendChild(label);
  wrap.appendChild(sw);
  row.appendChild(wrap);

  return row;
}

// ---- поиск ----
document.getElementById("search").addEventListener("input", function() {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll(".row").forEach(row => {
    if (!q) { row.classList.remove("search-hidden"); return; }
    const match = row.dataset.artist.includes(q) ||
                  row.dataset.venue.includes(q) ||
                  row.dataset.city.includes(q);
    row.classList.toggle("search-hidden", !match);
  });
  document.querySelectorAll(".date-group").forEach(g => {
    const visible = [...g.querySelectorAll(".row")].some(r => !r.classList.contains("search-hidden"));
    g.style.display = visible ? "" : "none";
  });
});

// ---- кнопки ----
document.getElementById("btn-show-all").addEventListener("click", () => {
  if (!confirm("Сделать все события видимыми?")) return;
  hidden.clear();
  markDirty();
  render();
});

document.getElementById("btn-save").addEventListener("click", pushSettings);

document.getElementById("btn-token").addEventListener("click", () => {
  const cur = getToken();
  const t = prompt(
    "GitHub Personal Access Token\n" +
    "(github.com → Settings → Developer settings → Personal access tokens → Fine-grained tokens,\n" +
    "доступ: Contents Read & write для репозитория mestovnet):",
    cur
  );
  if (t !== null) {
    localStorage.setItem(TOKEN_KEY, t.trim());
    updateTokenBtn();
  }
});

document.getElementById("btn-export").addEventListener("click", () => {
  const data = { hidden: [...hidden], times, names };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mestovnet-settings.json";
  a.click();
});

document.getElementById("btn-import").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (Array.isArray(d.hidden)) hidden = new Set(d.hidden);
      if (d.times && typeof d.times === "object") times = d.times;
      if (d.names && typeof d.names === "object") names = d.names;
      markDirty();
      render();
      alert("Настройки загружены. Нажмите «Сохранить изменения» чтобы опубликовать.");
    } catch {
      alert("Ошибка: файл повреждён или неверного формата.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

// ---- запуск ----
async function showApp() {
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app").style.display = "block";

  updateTokenBtn();
  updateSaveBtn();

  await loadSettings();

  fetch("events.json")
    .then(r => r.json())
    .then(data => { EVENTS = data; render(); })
    .catch(() => {
      document.getElementById("main").innerHTML = '<div class="empty">Не удалось загрузить события.</div>';
    });
}

if (checkAuth()) showApp();
</script>
