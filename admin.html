<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка — Местов.Нет</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
    }

    /* ---- auth screen ---- */
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
      padding: 24px;
    }

    #auth-screen h2 { font-size: 1.1rem; color: #aaa; }

    #auth-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 300px;
    }

    #auth-form input {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #f0f0f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    #auth-form input:focus { border-color: #555; }

    #auth-form button {
      background: #fff;
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    #auth-error {
      color: #bb7777;
      font-size: 0.85rem;
      display: none;
    }

    /* ---- admin app ---- */
    #app { display: none; }

    header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 { font-size: 1.3rem; font-weight: 700; }
    header a { color: #4a7aaa; font-size: 0.85rem; text-decoration: none; }
    header a:hover { color: #7aaadd; }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0f0f0f;
      border-bottom: 1px solid #222;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stats {
      font-size: 0.82rem;
      color: #666;
      margin-right: auto;
    }
    .stats b { color: #f0f0f0; }

    .toolbar-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #aaa;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .toolbar-btn:hover { border-color: #555; color: #fff; }
    .toolbar-btn.danger { border-color: #4a2222; color: #bb7777; }
    .toolbar-btn.danger:hover { border-color: #aa4444; color: #ffaaaa; background: #1a1010; }
    .toolbar-btn:disabled { opacity: 0.45; cursor: default; }

    .search-wrap {
      position: relative;
    }
    .search-wrap input {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #f0f0f0;
      padding: 6px 12px 6px 32px;
      border-radius: 20px;
      font-size: 0.82rem;
      outline: none;
      width: 200px;
      transition: border-color 0.15s, width 0.2s;
    }
    .search-wrap input:focus { border-color: #555; width: 260px; }
    .search-wrap::before {
      content: "⌕";
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #555;
      font-size: 1rem;
      pointer-events: none;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px;
    }

    .date-group h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #555;
      margin-bottom: 8px;
      margin-top: 28px;
    }
    .date-group:first-child h2 { margin-top: 0; }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #222;
      background: #151515;
      margin-bottom: 5px;
      transition: border-color 0.15s, opacity 0.2s;
    }

    .row.hidden-row { opacity: 0.4; }
    .row.hidden-row .row-artist { text-decoration: line-through; color: #555; }
    .row.search-hidden { display: none; }
    .row-wrapper.search-hidden { display: none; }

    .row-time-wrap {
      width: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .row-time {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    .row-time.no-time {
      color: #3a3a3a;
      font-size: 0.75rem;
      font-weight: 400;
      cursor: pointer;
      transition: color 0.15s;
    }
    .row-time.no-time:hover { color: #777; }

    .row-time.custom-time {
      color: #d4a84b;
      cursor: pointer;
      transition: color 0.15s;
    }
    .row-time.custom-time:hover { color: #f0c060; }

    .time-del {
      background: none;
      border: none;
      color: #3a3a3a;
      font-size: 0.9rem;
      line-height: 1;
      cursor: pointer;
      padding: 0 1px;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .time-del:hover { color: #bb7777; }

    .time-input {
      background: #1a1a1a;
      border: 1px solid #4a4a4a;
      border-radius: 5px;
      color: #f0f0f0;
      font-size: 0.78rem;
      padding: 2px 4px;
      width: 58px;
      outline: none;
      transition: border-color 0.15s;
    }
    .time-input:focus { border-color: #d4a84b; }

    .row-info {
      flex: 1;
      min-width: 0;
    }

    .row-artist {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e0e0e0;
      cursor: pointer;
    }

    .row-artist:hover { color: #fff; text-decoration: underline dotted #555; }
    .row-artist.custom-name { color: #7db87d; }
    .row-artist.custom-name:hover { color: #a0d4a0; }

    .name-input {
      background: #1a1a1a;
      border: 1px solid #4a4a4a;
      border-radius: 5px;
      color: #f0f0f0;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 2px 6px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    .name-input:focus { border-color: #7db87d; }

    .row-extra {
      font-size: 0.72rem;
      color: #555;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row-price {
      cursor: pointer;
      transition: color 0.15s;
    }
    .row-price:hover { color: #aaa; }
    .row-price.custom-price { color: #7db87d; }
    .row-price.custom-price:hover { color: #a0d4a0; }
    .row-price.no-price { color: #3a3a3a; }
    .row-price.no-price:hover { color: #666; }

    .price-input {
      background: #1a1a1a;
      border: 1px solid #4a4a4a;
      border-radius: 5px;
      color: #f0f0f0;
      font-size: 0.72rem;
      padding: 1px 5px;
      width: 120px;
      outline: none;
      transition: border-color 0.15s;
    }
    .price-input:focus { border-color: #7db87d; }

    .row-src { color: #3a3a3a; text-decoration: none; }
    .row-src:hover { color: #7aaadd; }

    .row-meta {
      font-size: 0.75rem;
      color: #555;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* toggle switch */
    .toggle-wrap {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-label {
      font-size: 0.75rem;
      color: #555;
      width: 38px;
      text-align: right;
    }
    .toggle-label.on { color: #77bb77; }

    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #2a2a2a;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid #333;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      background: #555;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    input:checked + .slider { background: #1a3a1a; border-color: #2a5a2a; }
    input:checked + .slider::before { transform: translateX(18px); background: #77cc77; }

    .empty { text-align: center; color: #555; padding: 60px 0; font-size: 0.95rem; }

    /* ---- expandable detail panel ---- */
    .row-expand-btn {
      background: none;
      border: none;
      color: #3a3a3a;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .row-expand-btn:hover { color: #aaa; }
    .row-expand-btn.open { color: #77cccc; }

    .row-detail {
      display: none;
      padding: 10px 14px 12px;
      border-top: 1px solid #222;
      margin-top: 4px;
    }
    .row-detail.open { display: block; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
    }
    @media (max-width: 540px) {
      .detail-grid { grid-template-columns: 1fr; }
    }

    .detail-field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .detail-field.full { grid-column: 1 / -1; }

    .detail-label {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #444;
    }
    .detail-label.custom { color: #5a8a5a; }

    .detail-value {
      font-size: 0.78rem;
      color: #888;
      cursor: pointer;
      transition: color 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .detail-value:hover { color: #ccc; }
    .detail-value.custom { color: #7db87d; }
    .detail-value.custom:hover { color: #a0d4a0; }
    .detail-value.empty-val { color: #333; }
    .detail-value.empty-val:hover { color: #666; }

    .detail-input {
      background: #1a1a1a;
      border: 1px solid #4a4a4a;
      border-radius: 5px;
      color: #f0f0f0;
      font-size: 0.78rem;
      padding: 3px 6px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    .detail-input:focus { border-color: #7db87d; }
    .detail-input.textarea {
      resize: vertical;
      min-height: 52px;
      white-space: pre-wrap;
    }

    /* ---- image block ---- */
    .detail-image-wrap {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .detail-img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #333;
      flex-shrink: 0;
      display: block;
    }
    .detail-img-placeholder {
      width: 72px;
      height: 72px;
      border-radius: 6px;
      border: 1px dashed #333;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #333;
    }
    .detail-img-actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
      flex: 1;
    }
    .detail-img-url {
      font-size: 0.72rem;
      color: #555;
      word-break: break-all;
    }
    .detail-img-url.custom { color: #7db87d; }
    .img-action-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #aaa;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      align-self: flex-start;
    }
    .img-action-btn:hover { border-color: #555; color: #fff; }
    .img-action-btn.del { border-color: #4a2222; color: #bb7777; }
    .img-action-btn.del:hover { border-color: #aa4444; color: #ffaaaa; background: #1a1010; }
    .img-input {
      background: #1a1a1a;
      border: 1px solid #4a4a4a;
      border-radius: 5px;
      color: #f0f0f0;
      font-size: 0.72rem;
      padding: 3px 6px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    .img-input:focus { border-color: #7db87d; }

    .detail-del-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: #3a3a3a;
      cursor: pointer;
      transition: color 0.15s;
      margin-top: 2px;
    }
    .detail-del-wrap:hover { color: #bb7777; }

    @media (max-width: 480px) {
      header { padding: 16px; }
      .toolbar { padding: 10px 16px; gap: 8px; }
      .search-wrap input { width: 140px; }
      .search-wrap input:focus { width: 180px; }
      main { padding: 12px; }
    }
  </style>
</head>
<body>

<!-- экран входа -->
<div id="auth-screen">
  <h2>Вход в админку</h2>
  <form id="auth-form">
    <input type="password" id="pwd-input" placeholder="Пароль" autocomplete="current-password">
    <button type="submit">Войти</button>
    <span id="auth-error">Неверный пароль</span>
  </form>
</div>

<!-- интерфейс админки -->
<div id="app">
  <header>
    <h1>Админка Местов.Нет</h1>
    <a href="index.html">← На сайт</a>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Поиск…">
    </div>
    <div class="stats" id="stats"></div>
    <button class="toolbar-btn" id="btn-show-all">Показать всё</button>
    <button class="toolbar-btn" id="btn-toggle-past">Прошедшие</button>
    <button class="toolbar-btn" id="btn-save" disabled>Сохранено ✓</button>
    <button class="toolbar-btn" id="btn-token">🔑 Токен</button>
    <button class="toolbar-btn" id="btn-export">Экспорт</button>
    <label class="toolbar-btn" id="btn-import-label">Импорт<input type="file" id="btn-import" accept=".json" style="display:none"></label>
    <button class="toolbar-btn danger" id="btn-logout">Выйти</button>
  </div>

  <main id="main"></main>
</div>

<script>
// ---- конфигурация ----
const GITHUB_REPO   = "kulakovakatalina-lab/mestovnet";
const GITHUB_BRANCH = "main";
const GITHUB_FILE   = "settings.json";

// SHA-256 хеш пароля (admin1234) — не храним пароль в открытом виде
const PASSWORD_HASH = "ac9689e2272427085e35b9d3e3e8bed88cb3434828b43b86fc0596cad4c6e270";

const SESSION_KEY = "mestovnet_admin_auth";
const TOKEN_KEY   = "mestovnet_github_token";

// Простая SHA-256 функция через Web Crypto API
async function sha256(text) {
  const encoder = new TextEncoder();
  const data = encoder.encode(text);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// ---- auth ----
function checkAuth() {
  return sessionStorage.getItem(SESSION_KEY) === "1";
}

document.getElementById("auth-form").addEventListener("submit", async e => {
  e.preventDefault();
  const val = document.getElementById("pwd-input").value;
  const hash = await sha256(val);
  if (hash === PASSWORD_HASH) {
    sessionStorage.setItem(SESSION_KEY, "1");
    showApp();
  } else {
    document.getElementById("auth-error").style.display = "block";
    document.getElementById("pwd-input").value = "";
  }
});

document.getElementById("btn-logout").addEventListener("click", () => {
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
});

// ---- состояние ----
let EVENTS = [];
let showPast = false;   // показывать ли прошедшие события
let hidden       = new Set();
let times        = {};
let names        = {};
let prices       = {};
let images       = {};   // кастомный URL/путь к картинке
let cities       = {};   // кастомный город
let venues       = {};   // кастомное место проведения
let descriptions = {};   // кастомное описание
let genres       = {};   // кастомный жанр
let dirty  = false;

const MONTHS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const DAYS = ["вс","пн","вт","ср","чт","пт","сб"];

// ---- GitHub API ----
function getToken() {
  return localStorage.getItem(TOKEN_KEY) || "";
}

function updateTokenBtn() {
  const btn = document.getElementById("btn-token");
  if (!btn) return;
  const has = !!getToken();
  btn.textContent = has ? "🔑 Токен ✓" : "🔑 Токен";
  btn.style.borderColor = has ? "#2a5a2a" : "";
  btn.style.color = has ? "#77cc77" : "";
}

function markDirty() {
  dirty = true;
  updateSaveBtn();
}

function updateSaveBtn() {
  const btn = document.getElementById("btn-save");
  if (!btn) return;
  btn.disabled = !dirty;
  btn.textContent = dirty ? "Сохранить изменения" : "Сохранено ✓";
  btn.style.borderColor = dirty ? "#2a5a5a" : "";
  btn.style.color = dirty ? "#77cccc" : "";
}

async function pushSettings() {
  const token = getToken();
  if (!token) {
    alert("Сначала введите GitHub токен (кнопка «🔑 Токен»).\n\nСоздайте токен на github.com → Settings → Developer settings → Personal access tokens → Fine-grained tokens.\nНужен доступ: Contents (Read and write) для репозитория mestovnet.");
    return;
  }

  const btn = document.getElementById("btn-save");
  btn.textContent = "Сохранение…";
  btn.disabled = true;

  const content = { hidden: [...hidden], times, names, prices, images, cities, venues, descriptions, genres };
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2))));

  try {
    const apiUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`;
    const headers = {
      Authorization: `token ${token}`,
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json"
    };

    const body = {
      message: "Admin: обновить настройки",
      content: encoded,
      branch: GITHUB_BRANCH
    };

    // получаем SHA текущего файла (нужен для обновления)
    const metaRes = await fetch(`${apiUrl}?ref=${GITHUB_BRANCH}`, { headers });
    if (metaRes.ok) {
      const meta = await metaRes.json();
      body.sha = meta.sha;
    }

    const res = await fetch(apiUrl, { method: "PUT", headers, body: JSON.stringify(body) });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `HTTP ${res.status}`);
    }

    dirty = false;
    updateSaveBtn();
  } catch(e) {
    alert("Ошибка сохранения: " + e.message);
    btn.textContent = "Сохранить изменения";
    btn.disabled = false;
  }
}

async function loadSettings() {
  try {
    const res = await fetch(`settings.json?_=${Date.now()}`);
    if (res.ok) {
      const d = await res.json();
      hidden       = new Set(d.hidden || []);
      times        = d.times        || {};
      names        = d.names        || {};
      prices       = d.prices       || {};
      images       = d.images       || {};
      cities       = d.cities       || {};
      venues       = d.venues       || {};
      descriptions = d.descriptions || {};
      genres       = d.genres       || {};
    }
  } catch { /* оставляем пустые defaults */ }
}

// ---- форматирование ----
function formatDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${DAYS[d.getDay()]}`;
}

function updateStats() {
  const total = EVENTS.length;
  const pastCount = EVENTS.filter(isPast).length;
  const hiddenCount = EVENTS.filter(e => hidden.has(e.source_url)).length;
  document.getElementById("stats").innerHTML =
    `всего <b>${total}</b> &nbsp;·&nbsp; скрыто <b>${hiddenCount}</b> &nbsp;·&nbsp; прошло <b>${pastCount}</b>`;
}

function updatePastBtn() {
  const btn = document.getElementById("btn-toggle-past");
  if (!btn) return;
  btn.textContent = showPast ? "Скрыть прошедшие" : "Прошедшие";
  btn.style.borderColor = showPast ? "#2a5a5a" : "";
  btn.style.color = showPast ? "#77cccc" : "";
}

function isPast(e) {
  if (!e.date) return false;
  const now = new Date();
  const eventTime = times[e.source_url] || e.time || "23:59";
  const eventDt = new Date(`${e.date}T${eventTime}:00`);
  return eventDt < now;
}

function render() {
  const main = document.getElementById("main");
  main.innerHTML = "";

  const visibleEvents = showPast ? EVENTS : EVENTS.filter(e => !isPast(e));

  const groups = {};
  visibleEvents.forEach(e => {
    const key = e.date || "no-date";
    if (!groups[key]) groups[key] = [];
    groups[key].push(e);
  });

  const sortedKeys = Object.keys(groups).sort((a, b) => {
    if (a === "no-date") return 1;
    if (b === "no-date") return -1;
    return a.localeCompare(b);
  });

  sortedKeys.forEach(key => {
    const group = document.createElement("div");
    group.className = "date-group";

    const h2 = document.createElement("h2");
    h2.textContent = key === "no-date" ? "Дата уточняется" : formatDate(key);
    group.appendChild(h2);

    const sorted = groups[key].slice().sort((a, b) => {
      if (a.time && b.time) return a.time.localeCompare(b.time);
      if (a.time) return -1;
      if (b.time) return 1;
      return 0;
    });

    sorted.forEach(event => group.appendChild(makeRow(event)));
    main.appendChild(group);
  });

  updateStats();
}

function renderTimeContent(wrap, e) {
  wrap.innerHTML = "";

  if (e.time) {
    const span = document.createElement("span");
    span.className = "row-time";
    span.textContent = e.time;
    wrap.appendChild(span);
    return;
  }

  const custom = times[e.source_url];

  if (custom) {
    const span = document.createElement("span");
    span.className = "row-time custom-time";
    span.textContent = custom;
    span.title = "Изменить время";
    span.addEventListener("click", () => showTimeInput(wrap, e));
    wrap.appendChild(span);

    const del = document.createElement("button");
    del.className = "time-del";
    del.textContent = "×";
    del.title = "Удалить время";
    del.addEventListener("click", ev => {
      ev.stopPropagation();
      delete times[e.source_url];
      markDirty();
      renderTimeContent(wrap, e);
    });
    wrap.appendChild(del);
  } else {
    const dash = document.createElement("span");
    dash.className = "row-time no-time";
    dash.textContent = "＋";
    dash.title = "Добавить время";
    dash.addEventListener("click", () => showTimeInput(wrap, e));
    wrap.appendChild(dash);
  }
}

function showTimeInput(wrap, e) {
  wrap.innerHTML = "";
  const input = document.createElement("input");
  input.type = "time";
  input.className = "time-input";
  input.value = times[e.source_url] || "";
  wrap.appendChild(input);
  input.focus();

  function commit() {
    const val = input.value;
    if (val) {
      times[e.source_url] = val;
    } else {
      delete times[e.source_url];
    }
    markDirty();
    renderTimeContent(wrap, e);
  }

  input.addEventListener("blur", commit);
  input.addEventListener("keydown", ev => {
    if (ev.key === "Enter") { ev.preventDefault(); input.blur(); }
    if (ev.key === "Escape") { renderTimeContent(wrap, e); }
  });
}

function renderArtistContent(wrap, e) {
  wrap.innerHTML = "";
  const custom = names[e.source_url];
  const span = document.createElement("span");
  span.className = "row-artist" + (custom ? " custom-name" : "");
  span.textContent = custom || e.artist || e.venue || "";
  span.title = "Нажмите чтобы изменить название";
  span.addEventListener("click", () => showNameInput(wrap, e));
  wrap.appendChild(span);
}

function showNameInput(wrap, e) {
  wrap.innerHTML = "";
  const input = document.createElement("input");
  input.type = "text";
  input.className = "name-input";
  input.value = names[e.source_url] || e.artist || e.venue || "";
  wrap.appendChild(input);
  input.focus();
  input.select();

  function commit() {
    const val = input.value.trim();
    const original = (e.artist || e.venue || "").trim();
    if (val && val !== original) {
      names[e.source_url] = val;
    } else {
      delete names[e.source_url];
    }
    markDirty();
    renderArtistContent(wrap, e);
  }

  input.addEventListener("blur", commit);
  input.addEventListener("keydown", ev => {
    if (ev.key === "Enter") { ev.preventDefault(); input.blur(); }
    if (ev.key === "Escape") { renderArtistContent(wrap, e); }
  });
}

function renderPriceContent(wrap, e) {
  wrap.innerHTML = "";
  const custom = prices[e.source_url];
  const original = e.price || null;
  const span = document.createElement("span");
  const display = custom !== undefined ? custom : original;
  if (custom !== undefined) {
    span.className = "row-price custom-price";
  } else if (original) {
    span.className = "row-price";
  } else {
    span.className = "row-price no-price";
  }

  span.title = "Нажмите чтобы изменить цену";
  span.addEventListener("click", () => showPriceInput(wrap, e));
  wrap.appendChild(span);
}

function showPriceInput(wrap, e) {

  const input = document.createElement("input");
  input.type = "text";
  input.className = "price-input";
  input.placeholder = "напр. от 500 ₽";
  input.value = prices[e.source_url] !== undefined ? prices[e.source_url] : (e.price || "");

  input.addEventListener("keydown", ev => {
    if (ev.key === "Enter") { ev.preventDefault(); input.blur(); }
    if (ev.key === "Escape") { renderPriceContent(wrap, e); }
  });
}

// ---- helpers for detail fields ----

// Универсальный инлайн-редактор для текстовых полей
function makeDetailField(container, labelText, getValue, isCustom, onSave, onClear, opts = {}) {
  container.innerHTML = "";

  const label = document.createElement("div");
  label.className = "detail-label" + (isCustom() ? " custom" : "");
  label.textContent = labelText;
  container.appendChild(label);

  const valueWrap = document.createElement("div");

  const current = getValue();
  if (opts.editing) {
    // показываем инпут сразу
    showDetailInput();
  } else {
    const span = document.createElement("span");
    span.className = "detail-value" + (isCustom() ? " custom" : (!current ? " empty-val" : ""));
    span.textContent = current || (opts.placeholder || "— нажмите чтобы изменить");
    span.title = "Нажмите чтобы изменить";
    span.addEventListener("click", showDetailInput);
    valueWrap.appendChild(span);

    // кнопка сброса кастомного значения
    if (isCustom()) {
      const del = document.createElement("span");
      del.className = "detail-del-wrap";
      del.innerHTML = "× сбросить";
      del.title = "Вернуть оригинальное значение";
      del.addEventListener("click", e => {
        e.stopPropagation();
        onClear();
        makeDetailField(container, labelText, getValue, isCustom, onSave, onClear, opts);
      });
      valueWrap.appendChild(del);
    }
  }

  container.appendChild(valueWrap);

  function showDetailInput() {
    valueWrap.innerHTML = "";
    let input;
    if (opts.textarea) {
      input = document.createElement("textarea");
      input.className = "detail-input textarea";
      input.rows = 3;
    } else {
      input = document.createElement("input");
      input.type = "text";
      input.className = "detail-input";
    }
    input.value = getValue() || "";
    if (opts.placeholder) input.placeholder = opts.placeholder;
    valueWrap.appendChild(input);
    input.focus();
    if (!opts.textarea) { input.select(); }

    function commit() {
      const val = input.value.trim();
      onSave(val);
      makeDetailField(container, labelText, getValue, isCustom, onSave, onClear, opts);
    }

    input.addEventListener("blur", commit);
    input.addEventListener("keydown", ev => {
      if (ev.key === "Enter" && !opts.textarea) { ev.preventDefault(); input.blur(); }
      if (ev.key === "Escape") { makeDetailField(container, labelText, getValue, isCustom, onSave, onClear, opts); }
    });
  }
}

// Рендер блока изображения
function renderImageBlock(container, e) {
  container.innerHTML = "";

  const label = document.createElement("div");
  const hasCustom = images[e.source_url] !== undefined;
  const hasDelete = images[e.source_url] === null; // null = удалить картинку
  label.className = "detail-label" + (hasCustom ? " custom" : "");
  label.textContent = "Картинка";
  container.appendChild(label);

  const wrap = document.createElement("div");
  wrap.className = "detail-image-wrap";

  // превью
  const currentImg = hasDelete ? null : (images[e.source_url] || e.image || null);
  if (currentImg) {
    const img = document.createElement("img");
    img.className = "detail-img";
    img.src = currentImg;
    img.alt = "";
    img.onerror = () => { img.style.display = "none"; };
    wrap.appendChild(img);
  } else {
    const ph = document.createElement("div");
    ph.className = "detail-img-placeholder";
    ph.textContent = "🖼";
    wrap.appendChild(ph);
  }

  const actions = document.createElement("div");
  actions.className = "detail-img-actions";

  // URL текущего изображения
  if (currentImg) {
    const urlTxt = document.createElement("div");
    urlTxt.className = "detail-img-url" + (hasCustom && !hasDelete ? " custom" : "");
    urlTxt.textContent = currentImg.length > 60 ? "…" + currentImg.slice(-55) : currentImg;
    urlTxt.title = currentImg;
    actions.appendChild(urlTxt);
  } else if (hasDelete) {
    const del = document.createElement("div");
    del.className = "detail-img-url";
    del.textContent = "картинка удалена";
    actions.appendChild(del);
  }

  // Кнопка «Изменить / Добавить URL»
  const editBtn = document.createElement("button");
  editBtn.className = "img-action-btn";
  editBtn.textContent = currentImg ? "Изменить URL" : "Добавить URL";
  editBtn.addEventListener("click", () => showImgInput(container, e, actions, editBtn));
  actions.appendChild(editBtn);

  // Кнопка «Удалить картинку» (если есть картинка)
  if (currentImg) {
    const delBtn = document.createElement("button");
    delBtn.className = "img-action-btn del";
    delBtn.textContent = "Удалить картинку";
    delBtn.addEventListener("click", () => {
      if (!confirm("Удалить картинку у этого мероприятия?")) return;
      images[e.source_url] = null; // null = явное удаление
      markDirty();
      renderImageBlock(container, e);
    });
    actions.appendChild(delBtn);
  }

  // Кнопка «Сбросить» (если есть кастом)
  if (hasCustom) {
    const resetBtn = document.createElement("button");
    resetBtn.className = "img-action-btn";
    resetBtn.textContent = "Сбросить к оригиналу";
    resetBtn.addEventListener("click", () => {
      delete images[e.source_url];
      markDirty();
      renderImageBlock(container, e);
    });
    actions.appendChild(resetBtn);
  }

  wrap.appendChild(actions);
  container.appendChild(wrap);
}

function showImgInput(container, e, actionsEl, triggerBtn) {
  // заменяем кнопку на инпут
  const input = document.createElement("input");
  input.type = "text";
  input.className = "img-input";
  input.placeholder = "https://… или /images/events/…";
  const cur = images[e.source_url];
  input.value = (cur && cur !== null) ? cur : "";
  actionsEl.replaceChild(input, triggerBtn);
  input.focus();

  function commit() {
    const val = input.value.trim();
    if (val) {
      images[e.source_url] = val;
    } else {
      delete images[e.source_url];
    }
    markDirty();
    renderImageBlock(container, e);
  }

  input.addEventListener("blur", commit);
  input.addEventListener("keydown", ev => {
    if (ev.key === "Enter") { ev.preventDefault(); input.blur(); }
    if (ev.key === "Escape") { renderImageBlock(container, e); }
  });
}

function makeRow(e) {
  const isHidden = hidden.has(e.source_url);

  // обёртка = строка + скрытая панель деталей
  const wrapper = document.createElement("div");
  wrapper.style.marginBottom = "5px";

  const row = document.createElement("div");
  row.className = "row" + (isHidden ? " hidden-row" : "");
  row.style.marginBottom = "0";
  row.style.borderRadius = "10px 10px 0 0";
  row.style.borderBottom = "none";
  row.dataset.artist = (e.artist || e.venue || "").toLowerCase();
  row.dataset.venue  = (e.venue || "").toLowerCase();
  row.dataset.city   = (e.source_city || "").toLowerCase();

  const timeWrap = document.createElement("div");
  timeWrap.className = "row-time-wrap";
  renderTimeContent(timeWrap, e);
  row.appendChild(timeWrap);

  const info = document.createElement("div");
  info.className = "row-info";

  const artistWrap = document.createElement("div");
  renderArtistContent(artistWrap, e);
  info.appendChild(artistWrap);

  const meta = document.createElement("div");
  meta.className = "row-meta";
  const metaParts = [];
  if (e.venue && e.artist) metaParts.push(venues[e.source_url] || e.venue);
  if (e.source_city) metaParts.push(cities[e.source_url] || e.source_city);
  if (e.event_type) metaParts.push(genres[e.source_url] || e.genre || e.event_type);
  meta.textContent = metaParts.join(" · ");
  info.appendChild(meta);

  const extra = document.createElement("div");
  extra.className = "row-extra";

  const priceWrap = document.createElement("span");
  renderPriceContent(priceWrap, e);
  extra.appendChild(priceWrap);

  if (e.source_url) {
    const src = document.createElement("a");
    src.className = "row-src";
    src.href = e.source_url;
    src.target = "_blank";
    src.textContent = "↗ источник";
    extra.appendChild(src);
  }

  info.appendChild(extra);
  row.appendChild(info);

  // --- кнопка разворачивания деталей ---
  const expandBtn = document.createElement("button");
  expandBtn.className = "row-expand-btn";
  expandBtn.title = "Редактировать детали";
  expandBtn.textContent = "✎";
  row.appendChild(expandBtn);

  // --- toggle видимости ---
  const toggleWrap = document.createElement("div");
  toggleWrap.className = "toggle-wrap";

  const label = document.createElement("span");
  label.className = isHidden ? "toggle-label" : "toggle-label on";
  label.textContent = isHidden ? "скрыто" : "видно";

  const sw = document.createElement("label");
  sw.className = "switch";

  const chk = document.createElement("input");
  chk.type = "checkbox";
  chk.checked = !isHidden;
  chk.addEventListener("change", () => {
    if (chk.checked) {
      hidden.delete(e.source_url);
      row.classList.remove("hidden-row");
      label.className = "toggle-label on";
      label.textContent = "видно";
    } else {
      hidden.add(e.source_url);
      row.classList.add("hidden-row");
      label.className = "toggle-label";
      label.textContent = "скрыто";
    }
    markDirty();
    updateStats();
  });

  const slider = document.createElement("span");
  slider.className = "slider";

  sw.appendChild(chk);
  sw.appendChild(slider);
  toggleWrap.appendChild(label);
  toggleWrap.appendChild(sw);
  row.appendChild(toggleWrap);

  // --- панель деталей (изначально скрыта) ---
  const detail = document.createElement("div");
  detail.className = "row-detail";
  detail.style.cssText = "background:#151515;border:1px solid #222;border-top:none;border-radius:0 0 10px 10px;padding:10px 14px 12px;display:none;";

  const grid = document.createElement("div");
  grid.className = "detail-grid";

  // -- Картинка (на всю ширину) --
  const imgField = document.createElement("div");
  imgField.className = "detail-field full";
  renderImageBlock(imgField, e);
  grid.appendChild(imgField);

  // -- Город --
  const cityField = document.createElement("div");
  cityField.className = "detail-field";
  makeDetailField(
    cityField, "Город",
    () => cities[e.source_url] || e.source_city || "",
    () => cities[e.source_url] !== undefined,
    val => {
      if (val && val !== (e.source_city || "").trim()) {
        cities[e.source_url] = val;
      } else {
        delete cities[e.source_url];
      }
      markDirty();
      // обновить meta строку
      const metaParts2 = [];
      if (e.venue && e.artist) metaParts2.push(venues[e.source_url] || e.venue);
      if (e.source_city) metaParts2.push(cities[e.source_url] || e.source_city);
      if (e.event_type) metaParts2.push(genres[e.source_url] || e.genre || e.event_type);
      meta.textContent = metaParts2.join(" · ");
    },
    () => { delete cities[e.source_url]; markDirty(); },
    { placeholder: "напр. Симферополь" }
  );
  grid.appendChild(cityField);

  // -- Место проведения --
  const venueField = document.createElement("div");
  venueField.className = "detail-field";
  makeDetailField(
    venueField, "Место проведения",
    () => venues[e.source_url] || e.venue || "",
    () => venues[e.source_url] !== undefined,
    val => {
      if (val && val !== (e.venue || "").trim()) {
        venues[e.source_url] = val;
      } else {
        delete venues[e.source_url];
      }
      markDirty();
      const metaParts2 = [];
      if (e.venue && e.artist) metaParts2.push(venues[e.source_url] || e.venue);
      if (e.source_city) metaParts2.push(cities[e.source_url] || e.source_city);
      if (e.event_type) metaParts2.push(genres[e.source_url] || e.genre || e.event_type);
      meta.textContent = metaParts2.join(" · ");
    },
    () => { delete venues[e.source_url]; markDirty(); },
    { placeholder: "напр. Арт Ковчег" }
  );
  grid.appendChild(venueField);

  // -- Жанр --
  const genreField = document.createElement("div");
  genreField.className = "detail-field";
  makeDetailField(
    genreField, "Жанр",
    () => genres[e.source_url] || e.genre || "",
    () => genres[e.source_url] !== undefined,
    val => {
      if (val && val !== (e.genre || "").trim()) {
        genres[e.source_url] = val;
      } else {
        delete genres[e.source_url];
      }
      markDirty();
      const metaParts2 = [];
      if (e.venue && e.artist) metaParts2.push(venues[e.source_url] || e.venue);
      if (e.source_city) metaParts2.push(cities[e.source_url] || e.source_city);
      if (e.event_type) metaParts2.push(genres[e.source_url] || e.genre || e.event_type);
      meta.textContent = metaParts2.join(" · ");
    },
    () => { delete genres[e.source_url]; markDirty(); },
    { placeholder: "напр. джаз, рок, электронная" }
  );
  grid.appendChild(genreField);

  // -- Описание (полная ширина) --
  const descField = document.createElement("div");
  descField.className = "detail-field full";
  makeDetailField(
    descField, "Описание",
    () => descriptions[e.source_url] !== undefined ? descriptions[e.source_url] : (e.description || ""),
    () => descriptions[e.source_url] !== undefined,
    val => {
      if (val !== (e.description || "").trim()) {
        descriptions[e.source_url] = val;
      } else {
        delete descriptions[e.source_url];
      }
      markDirty();
    },
    () => { delete descriptions[e.source_url]; markDirty(); },
    { textarea: true, placeholder: "Описание мероприятия" }
  );
  grid.appendChild(descField);

  detail.appendChild(grid);

  // --- открыть/закрыть панель ---
  expandBtn.addEventListener("click", e => {
    e.stopPropagation();
    const isOpen = detail.style.display !== "none";
    if (isOpen) {
      detail.style.display = "none";
      expandBtn.classList.remove("open");
      row.style.borderRadius = "10px";
      row.style.borderBottom = "";
    } else {
      detail.style.display = "block";
      expandBtn.classList.add("open");
      row.style.borderRadius = "10px 10px 0 0";
      row.style.borderBottom = "none";
    }
  });

  wrapper.appendChild(row);
  wrapper.appendChild(detail);

  // для поиска — делегируем dataset на wrapper
  wrapper.classList.add("row-wrapper");

  return wrapper;
}

// ---- поиск ----
document.getElementById("search").addEventListener("input", function() {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll(".row-wrapper").forEach(wrapper => {
    const row = wrapper.querySelector(".row");
    if (!row) return;
    if (!q) { wrapper.classList.remove("search-hidden"); return; }
    const match = (row.dataset.artist || "").includes(q) ||
                  (row.dataset.venue  || "").includes(q) ||
                  (row.dataset.city   || "").includes(q);
    wrapper.classList.toggle("search-hidden", !match);
  });
  document.querySelectorAll(".date-group").forEach(g => {
    const visible = [...g.querySelectorAll(".row-wrapper")].some(r => !r.classList.contains("search-hidden"));
    g.style.display = visible ? "" : "none";
  });
});

// ---- кнопки ----
document.getElementById("btn-show-all").addEventListener("click", () => {
  if (!confirm("Сделать все события видимыми?")) return;
  hidden.clear();
  markDirty();
  render();
});

document.getElementById("btn-toggle-past").addEventListener("click", () => {
  showPast = !showPast;
  updatePastBtn();
  render();
});

document.getElementById("btn-save").addEventListener("click", pushSettings);

document.getElementById("btn-token").addEventListener("click", () => {
  const cur = getToken();
  const t = prompt(
    "GitHub Personal Access Token\n" +
    "(github.com → Settings → Developer settings → Personal access tokens → Fine-grained tokens,\n" +
    "доступ: Contents Read & write для репозитория mestovnet):",
    cur
  );
  if (t !== null) {
    localStorage.setItem(TOKEN_KEY, t.trim());
    updateTokenBtn();
  }
});

document.getElementById("btn-export").addEventListener("click", () => {
  const data = { hidden: [...hidden], times, names, prices, images, cities, venues, descriptions, genres };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mestovnet-settings.json";
  a.click();
});

document.getElementById("btn-import").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (Array.isArray(d.hidden)) hidden = new Set(d.hidden);
      if (d.times        && typeof d.times        === "object") times        = d.times;
      if (d.names        && typeof d.names        === "object") names        = d.names;
      if (d.prices       && typeof d.prices       === "object") prices       = d.prices;
      if (d.images       && typeof d.images       === "object") images       = d.images;
      if (d.cities       && typeof d.cities       === "object") cities       = d.cities;
      if (d.venues       && typeof d.venues       === "object") venues       = d.venues;
      if (d.descriptions && typeof d.descriptions === "object") descriptions = d.descriptions;
      if (d.genres       && typeof d.genres       === "object") genres       = d.genres;
      markDirty();
      render();
      alert("Настройки загружены. Нажмите «Сохранить изменения» чтобы опубликовать.");
    } catch {
      alert("Ошибка: файл повреждён или неверного формата.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

// ---- запуск ----
async function showApp() {
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app").style.display = "block";

  updateTokenBtn();
  updateSaveBtn();
  updatePastBtn();

  await loadSettings();

  fetch("events.json")
    .then(r => r.json())
    .then(data => { EVENTS = data; render(); })
    .catch(() => {
      document.getElementById("main").innerHTML = '<div class="empty">Не удалось загрузить события.</div>';
    });
}

if (checkAuth()) showApp();
